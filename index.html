.lesson-intro-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px;flex-wrap:wrap}
.lesson-intro-title{font-size:calc(12px * var(--fs-scale));font-weight:700;color:var(--color-text-secondary)}
.li-verse{font-family:var(--serif);font-size:var(--fs);line-height:2.6;text-align:center;direction:rtl;color:var(--color-text-primary);padding:6px 0;border-bottom:0.5px dashed var(--color-border-tertiary);transition:background .3s}
.li-verse:last-child{border-bottom:none}
.li-verse.playing{background:var(--pur-l);border-radius:8px}
.vcard{background:var(--color-background-primary);border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-lg);padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.vcard:last-child{margin-bottom:0}
.vc-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px}
.vnum{font-size:calc(10px * var(--fs-scale));font-weight:700;padding:3px 10px;border-radius:20px;background:var(--pur-l);color:var(--pur);border:0.5px solid rgba(83,74,183,.2);flex-shrink:0}
.vacts{display:flex;gap:5px;flex-shrink:0}
.va{width:30px;height:30px;border-radius:50%;border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:calc(16px * var(--fs-scale));transition:.1s;font-family:var(--f);flex-shrink:0}
.va:active{transform:scale(.88)}.va.lk{background:#FFF0F5;border-color:#F0A0B5}
.vtxt{font-family:var(--serif);font-size:var(--fs);line-height:3.3;text-align:center;color:var(--color-text-primary);direction:rtl;padding:4px 0;word-break:break-word;overflow-wrap:break-word}
.wclk{cursor:pointer;border-radius:4px;transition:background .15s}
.wclk:hover,.wclk:active{background:var(--pur-l)}
@keyframes jumpPulse{0%,100%{box-shadow:0 0 0 0 rgba(88,167,0,0)}50%{box-shadow:0 0 0 5px rgba(88,167,0,.4)}}
.jump-highlight{animation:jumpPulse .8s ease-in-out 3;border-radius:var(--border-radius-lg,14px)}
.er-r{display:flex;justify-content:center;margin-top:5px}
.etgl{font-size:calc(10px * var(--fs-scale));font-weight:500;padding:3px 12px;border-radius:20px;border:0.5px solid var(--color-border-secondary);background:var(--color-background-secondary);color:var(--color-text-tertiary);cursor:pointer;font-family:var(--f)}
.etgl.on{background:var(--pur-l);color:var(--pur);border-color:rgba(83,74,183,.3)}
.vmean{margin-top:10px;padding:10px 13px;background:var(--color-background-secondary);border-radius:var(--border-radius-lg);border:0.5px solid var(--color-border-tertiary)}
.vmean-tx{font-size:calc(var(--fs) - 2px);line-height:2;color:var(--color-text-secondary);word-break:break-word;overflow-wrap:break-word}
.src-box{padding:10px 12px;border-radius:var(--border-radius-lg);margin-bottom:6px}
.src-box.q{border:0.5px solid rgba(8,80,65,.3);background:var(--grn-l)}.src-box.h{border:0.5px solid rgba(99,56,6,.3);background:var(--amb-l)}
.src-top{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.src-badge{font-size:calc(10px * var(--fs-scale));font-weight:700;padding:2px 9px;border-radius:20px;color:#fff;flex-shrink:0}
.src-badge.q{background:var(--grn)}.src-badge.h{background:var(--amb)}
.src-ref{font-size:calc(11px * var(--fs-scale));font-weight:600;flex:1;min-width:0;word-break:break-word;overflow-wrap:break-word}.src-ref.q{color:var(--grn)}.src-ref.h{color:var(--amb)}
.ext-link{font-size:calc(11px * var(--fs-scale));font-weight:600;text-decoration:none;padding:3px 10px;border-radius:20px;display:inline-flex;align-items:center;gap:3px;flex-shrink:0}
.ext-link.q{color:var(--pur);background:var(--pur-l);border:0.5px solid rgba(83,74,183,.3)}

function E(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function hl(s,q){var esc=E(s);if(!q)return esc;var qq=String(q).trim();if(!qq)return esc;try{var re=buildHlRegex(qq);if(!re)return esc;return esc.replace(re,'<mark style="background:#FFE066;color:#1a1a1a;border-radius:3px;padding:0 1px">$1</mark>');}catch(e){return esc;}}
function buildHlRegex(qq){
  if(!qq)return null;
  var HAR='[\\u064B-\\u065F\\u0670\\u06D6-\\u06ED\\u200c\\u200f\\u200e]*';
  var LETTER_CLASS={'ا':'[اأإآٱ]','أ':'[اأإآٱ]','إ':'[اأإآٱ]','آ':'[اأإآٱ]','ٱ':'[اأإآٱ]','ی':'[یي]','ي':'[یي]','ک':'[کك]','ك':'[کك]','ة':'[ةه]','ه':'[ةه]'};
  var chars=qq.split('');
  var parts=[];
  chars.forEach(function(ch){
    var piece;
    if(/\s/.test(ch)){piece='[\\s\\u200c]+';}
    else if(LETTER_CLASS[ch]){piece=LETTER_CLASS[ch];}
    else{piece=ch.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}
    parts.push(piece);
  });
  if(!parts.length)return null;
  return new RegExp('('+parts.join(HAR)+')','gi');
}

function isJalaliLeap(jy){var r=((jy+38)*682)%2816;return r<682;}
function jalaliMonthLength(jy,jm){if(jm<=6)return 31;if(jm<=11)return 30;return isJalaliLeap(jy)?30:29;}
function jalaliToGregorian(jy,jm,jd){jy+=1595;var days=-355668+(365*jy)+(div_(jy,33)*8)+div_(((jy%33)+3),4)+jd+((jm<7)?(jm-1)*31:((jm-7)*30)+186);var gy=400*div_(days,146097);days%=146097;if(days>36524){gy+=100*div_(--days,36524);days%=36524;if(days>=365)days++;}gy+=4*div_(days,1461);days%=1461;if(days>365){gy+=div_(days-1,365);days=(days-1)%365;}var gd=days+1;var isLeapG=(gy%4===0&&gy%100!==0)||(gy%400===0);var sal_a=[0,31,isLeapG?29:28,31,30,31,30,31,31,30,31,30,31];var gm;for(gm=1;gm<=12;gm++){if(gd<=sal_a[gm])break;gd-=sal_a[gm];}return[gy,gm,gd];}

function countPerfectWeeks(){var practiced={};streakData.history.forEach(function(d){practiced[d]=true;});(streakData.frozenDays||[]).forEach(function(d){practiced[d]=true;});var count=0;var d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-d.getDay()-7);while(true){var allDone=true;for(var i=0;i<7;i++){var dt=new Date(d.getTime()+i*86400000);var ds=dt.toISOString().slice(0,10);if(!practiced[ds]){allDone=false;break;}}if(!allDone)break;count++;d.setDate(d.getDate()-7);}return count;}

async function initLoad(){
  var p=await ld(PK);if(p)prefs=Object.assign(prefs,p);
  var u=await ld(UK);var isFirstVisit=!u;if(u)userData=u;
  var s=await ld(SK);if(s)streakData=Object.assign({streak:0,last:'',history:[],done:[],freezes:0,frozenDays:[],milestonesAwarded:[],dailyPts:{}},s);
  var rd=await ld(RK);if(rd)refData=Object.assign({studied:{},pointed:{},log:[],pageAwarded:{},popupAwarded:{},quranLog:[],hadithLog:[],sbrLog:[],purchasedContent:{}},rd);
  var dn=await ld(DK);if(dn)dailyNotes=dn;
  var fb=await ld(FK);if(fb)feedbackLog=fb;
  var c=await ld(CK);
  if(c&&c.verses&&c.verses.length>1){verses=c.verses;lessons=c.lessons||[];hasContent=true;loadedFrom='msn_content';}
  else if(window.EMBEDDED_CONTENT&&window.EMBEDDED_CONTENT.verses&&window.EMBEDDED_CONTENT.verses.length>1){
    verses=window.EMBEDDED_CONTENT.verses;lessons=window.EMBEDDED_CONTENT.lessons||[];hasContent=true;loadedFrom='built-in';
  }
  else{
    var AK='masnavi_panel_v18';
    var a=await ld(AK,true);
    if(!a||!a.verses||a.verses.length<2) a=await ld(AK,false);
    if(a&&a.verses&&a.verses.length>1){verses=a.verses;lessons=a.lessons||[];hasContent=true;loadedFrom='author panel (masnavi_panel_v18)';}
  }
  buildNumIndex();applyPrefs();updateStatusBox();
  setText('pts-num',getPts());setText('streak-num',streakData.streak);
  markAct();render();
  if(isFirstVisit){
    addPts(PT_WELCOME);
    var F=prefs.lang=='fa';
    setTimeout(function(){toast(F?'🎉 خوش آمدی! جایزهٔ ورود: +'+PT_WELCOME+' 💎':'🎉 Welcome! Sign-up bonus: +'+PT_WELCOME+' 💎',3200);},700);
  }
}
function checkReminder(){
  if(!prefs.reminderTime)return;
  if(!('Notification' in window))return;
  if(Notification.permission!=='granted')return;
  var now=new Date();
  var hh=String(now.getHours()).padStart(2,'0');
  var mm=String(now.getMinutes()).padStart(2,'0');
  var cur=hh+':'+mm;
  var today=todayStr();
  if(cur===prefs.reminderTime&&prefs.lastNotifiedDate!==today){
    prefs.lastNotifiedDate=today;sv(PK,prefs);
    var F=prefs.lang=='fa';
    var title=F?'یادآوری مطالعهٔ مثنوی':'Masnavi Study Reminder';
    var body=F?'وقتشه چند بیت امروز رو مطالعه کنی 📖':"Time for today's couplets 📖";
    if(navigator.serviceWorker&&navigator.serviceWorker.ready){
      navigator.serviceWorker.ready.then(function(reg){reg.showNotification(title,{body:body,icon:'icons/icon-192.png',badge:'icons/icon-192.png'});}).catch(function(){try{new Notification(title,{body:body,icon:'icons/icon-192.png'});}catch(e){}});
    }else{try{new Notification(title,{body:body,icon:'icons/icon-192.png'});}catch(e){}}
  }
}
initLoad();
setInterval(checkReminder,20000);
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')checkReminder();});
