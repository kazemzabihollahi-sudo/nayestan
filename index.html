<script>
/* Measure the real visible viewport height in pixels (more reliable across
   devices/browsers than vh/dvh units) and expose it as --app-height so the
   app exactly fills the screen with no leftover gap. */
(function(){
  function setAppHeight(){
    var h = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
    document.documentElement.style.setProperty('--app-height', h + 'px');
  }
  setAppHeight();
  window.addEventListener('resize', setAppHeight);
  window.addEventListener('orientationchange', function(){ setTimeout(setAppHeight, 100); });
  if(window.visualViewport) window.visualViewport.addEventListener('resize', setAppHeight);
})();
</script>
<script>
/* localStorage-backed shim for window.storage, so the panel's existing
   sv()/ld()/rm() calls work unmodified as a standalone web app. */
(function(){
  function k(key,shared){ return (shared?'shared:':'priv:')+key; }
  window.storage = {
    get: function(key,shared){
      return new Promise(function(resolve){
        try{
          var v = localStorage.getItem(k(key,shared));
          resolve(v==null?null:{key:key,value:v,shared:!!shared});
        }catch(e){ resolve(null); }
      });
    },
    set: function(key,value,shared){
      return new Promise(function(resolve){
        try{
          localStorage.setItem(k(key,shared), value);
          resolve({key:key,value:value,shared:!!shared});
        }catch(e){ resolve(null); }
      });
    },
    delete: function(key,shared){
      return new Promise(function(resolve){
        try{
          var existed = localStorage.getItem(k(key,shared))!=null;
          localStorage.removeItem(k(key,shared));
          resolve({key:key,deleted:existed,shared:!!shared});
        }catch(e){ resolve(null); }
      });
    },
    list: function(prefix,shared){
      return new Promise(function(resolve){
        try{
          var pre=(shared?'shared:':'priv:')+(prefix||'');
          var keys=[];
          for(var i=0;i<localStorage.length;i++){
            var lk=localStorage.key(i);
            if(lk.indexOf(pre)===0) keys.push(lk.slice(shared?7:5));
          }
          resolve({keys:keys,prefix:prefix,shared:!!shared});
        }catch(e){ resolve(null); }
      });
    }
  };
})();
</script>

َنِ ٱلنَّاسِ","noteFa":"همانان كه در فراخى و تنگى انفاق مى‌كنند و خشم خود را فرو مى‌برند و از مردم درمى‏‌گذرند.","noteEn":"˹They are˺ those who donate in prosperity and adversity, control their anger, and pardon others."}]}],"isShahBeyt":false,"shahBeytEn":"Many have failed to say, ‘If God should will,’\nAlthough their souls were in accordance still.","audioUrl":"https://pub-8a4a1795c6f64e5aa6236395759ee4db.r2.dev/%D8%B7%D9%88%D8%B7%DB%8C%20%D9%88%20%D8%A8%D9%82%D8%A7%D9%84%20%20%D8%A2%D8%AF%DB%8C%D9%88/1-252.mp3"},{"num":"253","text":"روزکی چندی سخن کوتاه کرد\nمرد بقال از ندامت آه کرد","textErab":"روزَکی چَندی سُخَن کوتاه کَرد\nمَردِ بَقّال از نِدامَت آه کَرد","themes":[],"sources":[],"maana":"چند روزی (طوطی) حرف نزد، و مرد بقّال از پشیمانی آه کشید.","maanaEn":"For a few days, (the parrot) refrained from speaking, and the greengrocer, sighed deeply in remorse.","tafsir":"","tafsirEn":"","tafsirRefs":[],"reflections":[],"isShahBeyt":false,"shahBeytEn":"They skipped ‘If God wills’ through their arrogance,\nSo God revealed through them Man’s impotence.","audioUrl":"https://pub-8a4a1795c6f64e5aa6236395759ee4db.r2.dev/%D8%B7%D9%88%D8%B7%DB%8C%20%D9%88%20%D8%A8%D9%82%D8%A7%D9%84%20%20%D8%A2%D8%AF%DB%8C%D9%88/1-253.mp3"},{"num":"254","text":"ریش بر می‌‌کند و می‌‌گفت ای دریغ\nکافتاب نعمتم شد زیر میغ‌‌","textErab":"ریش بَر می‌کَند و می‌گُفت ای دِریغ\nکافتابِ نِعمَتَم شُد زیرِ میغ","themes":[],"sources":[],"maana":"ریشش را می‌کَند و می‌گفت: ای افسوس، آفتاب نعمتم پشتِ ابر رفت (کنایه از زایل شدن آواز طوطی و بی قیمت شدنش).","maanaEn":"He was tearing his beard and saying, \"Alas!, The sun of my prosperity has gone behind the clouds.\" (meaning that the parrot had lost its voice and become worthless).","tafsir":"","tafsirEn":"","tafsirRefs":[],"reflections":[],"isShahBeyt":false,"shahBeytEn":"They skipped ‘If God wills’ through their arrogance,\nSo God revealed through them Man’s impotence.","audioUrl":"https://pub-8a4a1795c6f64e5aa6236395759ee4db.r2.dev/%D8%B7%D9%88%D8%B7%DB%8C%20%D9%88%20%D8%A8%D9%82%D8%A7%D9%84%20%20%D8%A2%D8%AF%DB%8C%D9%88/1-254.mp3"},{"num":"255","text":"دست من بشکسته بودی آن زمان\nکه زدم من بر سر آن خوش زبان‌‌ ","textErab":"دَستِ مَن بِشکَسته بودی آن زَمان\nکه زَدَم مَن بَر سَرِ آن خوش‌زَبان","themes":[],"sources":[],"maana":"ای کاش دستم شکسته بود آن لحظه‌ای که بر سر آن (مرغِ) خوش‌زبان زدم.","maanaEn":"Would that my hand had been broken at the moment, when I struck that sweet-tongued one on the head.","tafsir":"","tafsirEn":"","tafsirRefs":[],"reflections":[],"isShahBeyt":false,"shahBeytEn":"They skipped ‘If God wills’ through their arrogance,\nSo God revealed through them Man’s impotence.","audioUrl":"https://pub-8a4a1795c6f64e5aa6236395759ee4db.r2.dev/%D8%B7%D9%88%D8%B7%DB%8C%20%D9%88%20%D8%A8%D9%82%D8%A7%D9%84%20%20%D8%A2%D8%AF%DB%8C%D9%88/1-255.mp3"},{"num":"256","text":"هدیه‌‌ها می‌‌داد هر درویش را\nتا بیابد نطق مرغ خویش را","textErab":"هِدیه‌ها می‌داد هَر دَرویش را\nتا بیابَد نُطقِ مُرغِ خویش را","themes":["صدقه","انفاق"],"sources":[{"type":"hadith","surah":"","ayah":"","book":"tirmidhi","num":"664","textAr":" إِنَّ الصَّدَقَةَ لَتُطْفِئُ غَضَبَ الرَّبِّ وَ تَدْفَعُ مِيتَةَ السُّوءِ ‏","note":"پیامبر خدا فرمود: همانا صدقه غضب پروردگار را خاموش می‌کند و از مرگ بد محافظت می‌نماید","noteEn":"The Messenger of God said: 'Indeed, charity extinguishes the Lord's anger and it protects against the evil death.'"}],"maana":"به هر درویشی هدیه می‌داد (به این امید) که طوطی اش دوباره به سخن درآید.","maanaEn":"He was giving gifts to every dervish, in hopes of recovering the speech of his bird.","tafsir":"در اینجا اشاره به این مطلب است که هر وقت طوطی روح کسی از ذکر و تسبیح کردن بماند و لال شود و نتواند سخن بگوید این حالت نیز نوعی بلا است که در اثر غضب مولاست. هیچ چیز بلا را دفع نمی‌کند و آتش غضب را خاموش نمی‌کند مگر صدقه.","tafsirEn":"The allusion here is to the following: whenever the parrot of a person's soul ceases its remembrance and glorification of God, falls mute, and loses the power of speech, this condition too is a form of tribulation, one that arises from the wrath of the Master. Nothing averts tribulation and nothing extinguishes the fire of divine wrath except charity.","tafsirRefs":[],"reflections":[],"isShahBeyt":false,"shahBeytEn":"Many have failed to say, ‘If God should will,’\nAlthough their souls were in accordance still.","audioUrl":"https://pub-8a4a1795c6f64e5aa6236395759ee4db.r2.dev/%D8%B7%D9%88%D8%B7%DB%8C%20%D9%88%20%D8%A8%D9%82%D8%A7%D9%84%20%20%D8%A2%D8%AF%DB%8C%D9%88/1-256.mp3"},{"num":"257","text":"بعد سه روز و سه شب حیران و زار\nبر دکان بنشسته بد نومید وار\n","textErab":"بَعدِ سِه روز و سِه شَب حِیران و زار\nبَر دُکّان بِنشَسته بُد نومیدوار","themes":[],"sources":[],"maana":"پس از سه شبانه روز، سرگشته و اندوهگین، ناامیدانه در مغازه نشسته بود.","maanaEn":"After three days and three nights, he was seated at the shop, distraught and sorrowful, like a man in despair.","tafsir":"","tafsirEn":"","tafsirRefs":[],"reflections":[],"isShahBeyt":false,"shahBeytEn":"They skipped ‘If God wills’ through their arrogance,\nSo God revealed through them Man’s impotence.","audioUrl":"https://pub-8a4a1795c6f64e5aa6236395759ee4db.r2.dev/%D8%B7%D9%88%D8%B7%DB%8C%20%D9%88%20%D8%A8%D9%82%D8%A7%D9%84%20%20%D8%A2%D8%AF%DB%8C%D9%88/1-257.mp3"},{"num":"258","text":"می‌‌نمود آن مرغ را هر گون شگفت\nتا که باشد کاندر آید او بگفت‌‌","textErab":"می‌نِمود آن مُرغ را هَر گون شِگُفت\nتا که باشَد کاندَر آیَد او بِگُفت","themes":[],"sources":[],"maana":"هر نوع چیز شگفت‌انگیز و عجیبی به آن مرغ نشان می‌داد، (به این امید) که شاید طوطی به سخن درآید.","maanaEn":"Showing the bird every sort of marvel, (in the hope) that maybe it would begin to speak.","tafsir":"","tafsirEn":"","tafsirRefs":[],"reflections":[],"isShahBeyt":false,"shahBeytEn":"They skipped ‘If God wills’ through their arrogance,\nSo God revealed through them Man’s impotence.","audioUrl":"https://pub-8a4a1795c6f64e5aa6236395759ee4db.r2.dev/%D8%B7%D9%88%D8%B7%DB%8C%20%D9%88%20%D8%A8%D9%82%D8%A7%D9%84%20%20%D8%A2%D8%AF%DB%8C%D9%88/1-258.mp3"},{"num":"259","text":"جولقیی سر برهنه می‌‌گذشت\nبا سر بی‌‌مو چو پشت طاس و طشت‌‌","textErab":"جولَقیی سَر بِرِهنه می‌گُذَشت\nبا سَرِ بی‌مو چو پُشتِ طاس و طَشت","themes":[],"sources":[],"maana":"(در این میان) درویشی ژنده‌پوش با سری برهنه از آنجا می‌گذشت، سری بی‌مو، مانند پشتِ کاسه و طشت.","maanaEn":"(Meanwhile) a bare-headed dervish (clad in a coarse woollen frock) passed by, with a head hairless as the back of a bowl or basin..","tafsir":"","tafsirEn":"","tafsirRefs":[],"reflections":[],"isShahBeyt":false,"shahBeytEn":"They skipped ‘If God wills’ through their arrogance,\nSo God revealed through them Man’s impotence.","audioUrl":"https://pub-8a4a1795c6f64e5aa6236395759ee4db.r2.dev/%D8%B7%D9%88%D8%B7%DB%8C%20%D9%88%20%D8%A8%D9%82%D8%A7%D9%84%20%20%D8%A2%D8%AF%DB%8C%D9%88/1-259.mp3"},{"num":"260","text":"طوطی اندر گفت آمد در زمان\nبانگ بر درویش زد که هی فلان‌‌ ","textErab":"طوطی اندَر گُفت آمَد در زَمان\nبانگ بَر دَرویش زَد که هِی فُلان","themes":[],"sources":[],"maana":"طوطی فوری به سخن آمد و داد بر سر درویش زد که: هی، فلانی!","maanaEn":"Thereupon, the parrot broke into speech, crying out to the dervish, “Hey, fellow!\"","tafsir":"","tafsirEn":"","tafsirRefs":[],"reflections":[],"isShahBeyt":false,"shahBeytEn":"They skipped ‘If God wills’ through their arrogance,\nSo God revealed through them Man’s impotence.","audioUrl":"https://pub-8a4a1795c6f64e5aa6236395759ee4db.r2.dev/%D8%B7%D9%88%D8%B7%DB%8C%20%D9%88%20%D8%A8%D9%82%D8%A7%D9%84%20%20%D8%A2%D8%AF%DB%8C%D9%88/1-260.mp3"},{"num":"261","text":"از چه ای کل با کلان آمیختی\nتو مگر از شیشه روغن ریختی‌‌","textErab":"از چِه ای کَل با کَلان آمیختی\nتو مَگَر از شیشه روغَن ریختی","themes":[],"sources":[],"maana":"ای کچل، چطور با کچل‌ها همنشین شدی؟ مگر تو هم (مثل من) از شیشه روغن ریختی؟","maanaEn":"O bald one, how were you mixed up with the bald? Did you too (like me) spill oil from a bottle?","tafsir":"","tafsirEn":"","tafsirRefs":[],"reflections":[],"isShahBeyt":false,"shahBeytEn":"They skipped ‘If God wills’ through their arrogance,\nSo God revealed through them Man’s impotence.","audioUrl":"https://pub-8a4a1795c6f64e5aa6236395759ee4db.r2.dev/%D8%B7%D9%88%D8%B7%DB%8C%20%D9%88%20%D8%A8%D9%82%D8%A7%D9%84%20%20%D8%A2%D8%AF%DB%8C%D9%88/1-261.mp3"},{"num":"262","text":"از قیاسش خنده آمد خلق را\nکو چو خود پنداشت صاحب دلق را","textErab":"از قِیاسَش خَنده آمَد خَلق را\nکو چو خود پِنداشت صاحِب دَلق را","themes":["قیاس"],"sources":[],"maana":"از مقایسه‌ی طوطی، مردم به خنده افتادند که چگونه صاحبِ جامه کهنه را مثل خودش پنداشت.","maanaEn":"The people burst out laughing at the parrot's comparison, for it had taken the wearer of the frock (the dervish) to be just like itself.","tafsir":"","tafsirEn":"","tafsirRefs":[],"reflections":[],"isShahBeyt":false,"shahBeytEn":"They skipped ‘If God wills’ through their arrogance,\nSo God revealed through them Man’s impotence.","audioUrl":"https://pub-8a4a1795c6f64e5aa6236395759ee4db.r2.dev/%D8%B7%D9%88%D8%B7%DB%8C%20%D9%88%20%D8%A8%D9%82%D8%A7%D9%84%20%20%D8%A2%D8%AF%DB%8C%D9%88/1-262.mp3"},{"num":"263","text":"کار پاکان را قیاس از خود مگیر\nگر چه ماند در نبشتن شیر و شیر","textErab":"کارِ پاکان را قِیاس از خود مَگیر\nگَر چِه مانَد در نِبِشتَن شیر و شیر","themes":["قیاس"],"sources":[],"maana":"کار انسان‌های پاک را با معیار خودت نسنج، هرچند که در نوشتن، «شیر» (حیوان درنده) و «شیر» (نوشیدنی) یکی به نظر می‌رسند.","maanaEn":"Do not measure the actions of the pure by your own standard, even though shér (lion) and shír (milk) are written the same way (in Persian).","tafsir":"","tafsirEn":"","tafsirRefs":[],"reflections":[{"fa":"آیا تو نیز، مثل بسیاری، فقط به ظاهر و صورتِ مردم نگاه می‌کنی حال آنکه گفته شده خدا به جسم و صورتِ شما نمی‌نگرد، بلکه به دل‌هایتان می‌نگرد؟ ","en":"Do you, like many, look only at people's outward form and appearance when it has been said that God does not look at your bodies or your faces, but looks at your hearts?","refs":[{"type":"hadith","surah":"","ayah":"","book":"muslim","num":"2564b","textAr":" إِنَّ اللَّهَ لاَ يَنْظُرُ إِلَى أَجْسَادِكُمْ وَ لاَ إِلَى صُوَرِكُمْ وَ لَكِنْ يَنْظُرُ إِلَى قُلُوبِكُمْ ","noteFa":"پیامبر خدا فرمود: همانا خداوند به بدن‌ها و چهره‌های شما نمی‌نگرد، بلکه به دل‌هایتان می‌نگرد.","noteEn":"The Messenger of God said: 'Verily God does not look to your bodies nor to your faces, but He looks to your hearts.'"}]}],"isShahBeyt":true,"shahBeytEn":"Don’t you compare yourself with God’s élite,\nRemember ‘souls’ just sounds like ‘soles’ of feet!","audioUrl":"https://pub-8a4a1795c6f64e5aa6236395759ee4db.r2.dev/%D8%B7%D9%88%D8%B7%DB%8C%20%D9%88%20%D8%A8%D9%82%D8%A7%D9%84%20%20%D8%A2%D8%AF%DB%8C%D9%88/1-263.mp3"},{"num":"264","text":"جمله عالم زین سبب گمراه شد\nکم کسی ز ابدال حق آگاه شد","textErab":"جُملِه عالَم زِین سَبَب گُمراه شُد\nکَم کَسی ز اَبدالِ حَق آگاه شُد","themes":["قیاس"],"sources":[],"maana":"به همین سبب (مقایسه پاکان با خود) تمام مردم جهان به گمراهی افتادند، و کمتر کسی از اولیای خداوند خبردار شد.","maanaEn":"For this very reason (measuring the pure against themselves) the whole world has gone astray, and few came to know God's saints (the Abdāl or Substitutes).","tafsir":"ابدال گروهی از مردان حق هستند که صفات زشت بشری را با اوصاف نیک الهی بَدَل کرده‌اند. یعنی آنانکه اولیاء الله را مثل خودشان تصور می‌کنند، در حالی که  به مرتبه الهی آنها آگاه نیستند، در گمراهی افتاده‌اند.","tafsirEn":"Abdal (the Substitutes) are a group of righteous men of God who have exchanged negative human traits for divine virtues. That is to say, those who perceive the Friends of God as mere ordinary people like themselves, while remaining oblivious to their spiritual stations, have fallen into misguidance.","tafsirRefs":[],"reflections":[],"isShahBeyt":false,"shahBeytEn":"Don’t you compare yourself with God’s élite,\nRemember ‘souls’ just sounds like ‘soles’ of feet!","audioUrl":"https://pub-8a4a1795c6f64e5aa6236395759ee4db.r2.dev/%D8%B7%D9%88%D8%B7%DB%8C%20%D9%88%20%D8%A8%D9%82%D8%A7%D9%84%20%20%D8%A2%D8%AF%DB%8C%D9%88/1-264.mp3"},{"num":"265","text":"همسری با انبیا برداشتند\nاولیا را همچو خود پنداشتند\n","textErab":"هَمسَری با انبیا بَرداشتَند\nاولیا را هَمچو خود پِنداشتَند","themes":["قیاس"],"sources":[{"type":"quran","surah":"14","ayah":"10","book":"","num":"","textAr":"قَالُوٓا۟ إِنْ أَنتُمْ إِلَّا بَشَرٌۭ مِّثْلُنَا","note":"گفتند شما نیز جز بشرى مانند ما نيستيد.","noteEn":"They argued, “You are no more than humans like us!"}],"maana":"ادعای برابری با پیامبران کردند، و اولیای خدا را همانند خودشان انگاشتند.","maanaEn":"They presumed themselves equal to the prophets, and assumed the saints to be just like themselves.","tafsir":"","tafsirEn":"","tafsirRefs":[],"reflections":[{"fa":" آیا تو نیز، مانند آن قومی که گفتند «آیا خدا بشری را به پیامبری فرستاد؟»، صرفاً به‌خاطرِشباهت ظاهری یک ولیّ یا فرستاده به خودت، از پذیرفتنِ او سرباز زده‌ای؟ ","en":"Like those who asked, \"Has God sent a human being as a messenger?\", have you ever refused to accept a saint or messenger merely because they are human like you?","refs":[{"type":"quran","surah":"17","ayah":"94","book":"","num":"","textAr":"وَ مَا مَنَعَ ٱلنَّاسَ أَن يُؤْمِنُوٓا۟ إِذْ جَآءَهُمُ ٱلْهُدَىٰٓ إِلَّآ أَن قَالُوٓا۟ أَبَعَثَ ٱللَّهُ بَشَرًۭا رَّسُولًۭا","noteFa":"و [چيزى] مردم را از ايمان آوردن باز نداشت آنگاه كه هدايت برايشان آمد جز اينكه گفتند آيا خدا بشرى را به سمت رسول مبعوث كرده است.","noteEn":"And nothing has prevented people from believing when guidance comes to them except their protest: “Has God sent a human as a messenger?”"}]}],"isShahBeyt":false,"shahBeytEn":"Don’t you compare yourself with God’s élite,\nRemember ‘souls’ just sounds like ‘soles’ of feet!","audioUrl":"https://pub-8a4a1795c6f64e5aa6236395759ee4db.r2.dev/%D8%B7%D9%88%D8%B7%DB%8C%20%D9%88%20%D8%A8%D9%82%D8%A7%D9%84%20%20%D8%A2%D8%AF%DB%8C%D9%88/1-265.mp3"},{"num":"266","text":"گفته اینک ما بشر ایشان بشر\nما و ایشان بسته‌‌ی خوابیم و خور","textErab":"گُفته اینَک ما بَشَر ایشان بَشَر\nما و ایشان بَسته‌یِ خوابیم و خَور","themes":["قیاس"],"sources":[{"type":"quran","surah":"21","ayah":"3","book":"","num":"","textAr":"هَلْ هَـٰذَآ إِلَّا بَشَرٌۭ مِّثْلُكُمْ ","note":"آيا اين [مرد] جز بشرى مثل شماست؟","noteEn":"Is this ˹one˺ not human like yourselves?"},{"type":"quran","surah":"25","ayah":"7","book":"","num":"","textAr":"وَ قَالُوا۟ مَالِ هَـٰذَا ٱلرَّسُولِ يَأْكُلُ ٱلطَّعَامَ وَ يَمْشِى فِى ٱلْأَسْوَاقِ ۙ","note":"و گفتند اين چه پيامبرى است كه غذا مى ‏خورد و در بازارها راه مى ‏رود؟","noteEn":"And they say ˹mockingly˺, “What kind of messenger is this who eats food and goes about in market-places ˹for a living˺?"}],"maana":"گفتند ما هم انسانیم و آن‌ها هم انسان، ما و آن‌ها هر دو گرفتار خواب و خوراکیم.","maanaEn":"They said: we are human and they are human, we and they alike are bound by sleep and food.","tafsir":"","tafsirEn":"","tafsirRefs":[],"reflections":[{"fa":"آیا کسی که با نورِ حقیقت زنده گشته و در میانِ مردم بدان نور راه می‌رود، همانندِ کسی است که در تاریکی‌هاست و هرگز از آن بیرون نمی‌آید؟","en":"Is one brought to life by the light of truth, walking among people by that light, the same as one who remains in darkness, never emerging from it?","refs":[{"type":"quran","surah":"6","ayah":"122","book":"","num":"","textAr":"أَوَ مَن كَانَ مَيْتًۭا فَأَحْيَيْنَـٰهُ وَ جَعَلْنَا لَهُۥ نُورًۭا يَمْشِى بِهِۦ فِى ٱلنَّاسِ كَمَن مَّثَلُهُۥ فِى ٱلظُّلُمَـٰتِ لَيْسَ بِخَارِجٍۢ مِّنْهَا","noteFa":"آيا كسى كه مرده[دل] بود و زنده‏‌اش گردانيديم و براى او نورى پديد آورديم تا در پرتو آن در ميان مردم راه برود چون كسى است كه گويى گرفتار در تاريكي‌هاست و از آن بيرون‏ آمدنى نيست؟","noteEn":"Can those who had been dead, to whom We gave life and a light with which they can walk among people, be compared to those in complete darkness from which they can never emerge?"}]}],"isShahBeyt":false,"shahBeytEn":"Don’t you compare yourself with God’s élite,\nRemember ‘souls’ just sounds like ‘soles’ of feet!","audioUrl":"https://pub-8a4a1795c6f64e5aa6236395759ee4db.r2.dev/%D8%B7%D9%88%D8%B7%DB%8C%20%D9%88%20%D8%A8%D9%82%D8%A7%D9%84%20%20%D8%A2%D8%AF%DB%8C%D9%88/1-266.mp3"},{"num":"267","text":"این ندانستند ایشان از عمی\nهست فرقی در میان بی‌‌منتها\n","textErab":"این نَدانستند ایشان از عَمی\nهَست فَرقی در میان بی‌مُنتَها","themes":["قیاس"],"sources":[{"type":"quran","surah":"35","ayah":"19","book":"","num":"","textAr":"وَ مَا يَسْتَوِى ٱلْأَعْمَىٰ وَ ٱلْبَصِيرُ","note":"و نابينا و بينا يكسان نيستند.","noteEn":"Those blind ˹to the truth˺ and those who can see are not equal,"}],"maana":"اینان از کوردلی این را ندانستند که بینِ آن‌ها (با انبیاء و اولیاء) تفاوتی بی‌پایان وجود دارد.","maanaEn":"(Yet) in their (spiritual) blindness, they did not see that an endless difference lies in between (themselves and the saints).","tafsir":"این بیت بیانگر آن است که گمراهان به دلیل کوردلی، تفاوت بنیادین میان خود و اولیای خدا را درک نمی‌کنند؛ آن‌ها به اشتباه تصور می‌کنند که شباهت در ظاهرِ بشری به معنای یکسانی در حقیقتِ باطنی است. به همین ترتیب، پیامبر اکرم (ص) نیز اگرچه در ظاهر فرمودند «من بشری مثل شما هستم»، اما بلافاصله با عبارت «به من وحی می‌شود» (یوحیٰ الیّ) مرتبهٔ الهی و متمایز خود را آشکار ساختند[1].","tafsirEn":"This verse explains that the misguided, due to their spiritual blindness, fail to recognize the immense difference between themselves and the Friends of God (Awliya). They wrongly assume that a shared human appearance implies identity in spiritual reality. Similarly, while the Prophet acknowledged his human nature by stating, \"I am only a human like you,\" he immediately distinguished his exalted spiritual station with the phrase, \"It is revealed to me\" (Yuhá ilayy)[1].","tafsirRefs":[{"type":"quran","surah":"41","ayah":"6","book":"","num":"","textAr":"قُلْ إِنَّمَآ أَنَا۠ بَشَرٌۭ مِّثْلُكُمْ يُوحَىٰٓ إِلَىَّ","noteFa":"بـگـو مـن تـنـهـا بـشـرى هـستم مثل شما با اين فرق كه به من وحى مى شود.","noteEn":"Say, ˹O Prophet,˺ “I am only a man like you, ˹but˺ it has been revealed to me.","id":1}],"reflections":[{"fa":"آیا گمان می‌بری، چون فرستادگانِ خدا گفتند «ما جز بشری مانند شما نیستیم»، پس هیچ برتری و منتی از جانب خدا بر برخی بندگان خاصش نیست؟","en":"Do you suppose that, because God's messengers said \"We are nothing but humans like you,\" God has bestowed no special favour or blessing upon some of His special servants?","refs":[{"type":"quran","surah":"14","ayah":"11","book":"","num":"","textAr":"قَالَتْ لَهُمْ رُسُلُهُمْ إِن نَّحْنُ إِلَّا بَشَرٌۭ مِّثْلُكُمْ وَ لَـٰكِنَّ ٱللَّهَ يَمُنُّ عَلَىٰ مَن يَشَآءُ مِنْ عِبَادِهِۦ ","noteFa":"پيامبرانشان به آنان گفتند ما جز بشرى مثل شما نيستيم ولى خدا بر هر يك از بندگانش كه بخواهد منت مى‌نهد.","noteEn":"Their messengers said to them, “We are ˹indeed˺ only humans like you, but God favours whoever He chooses of His servants."}]}],"isShahBeyt":false,"shahBeytEn":"Don’t you compare yourself with God’s élite,\nRemember ‘souls’ just sounds like ‘soles’ of feet!","audioUrl":"https://pub-8a4a1795c6f64e5aa6236395759ee4db.r2.dev/%D8%B7%D9%88%D8%B7%DB%8C%20%D9%88%20%D8%A8%D9%82%D8%A7%D9%84%20%20%D8%A2%D8%AF%DB%8C%D9%88/1-267.mp3"},{"num":"268","text":"هر دو گون زنبور خوردند از محل\nلیک شد زان نیش و زین دیگر عسل‌‌\n","textErab":"هَر دو گون زَنبور خوردَند از مَحَل\nلیک شُد زآن نیش و زین دیگَر عَسَل","themes":["قیاس"],"sources":[{"type":"quran","surah":"2","ayah":"26","book":"","num":"","textAr":"۞ إِنَّ ٱللَّهَ لَا يَسْتَحْىِۦٓ أَن يَضْرِبَ مَثَلًۭا مَّا بَعُوضَةًۭ فَمَا فَوْقَهَا","note":"خدا از اينكه به پشه و يا كوچكتر از آن مثل بزند شرم نمى‌كند.","noteEn":"Surely God does not shy away from using the parable of a mosquito or what is even smaller."}],"maana":"هر دو نوع زنبور(زنبور عسل و زنبور زرد) از یک جا (شیره) خوردند، اما از یکی نیش پدید آمد و از دیگری عسل.","maanaEn":"Both species of zanbúr fed from the (same) place, yet from one (the hornet) came a sting and from the other (the bee) honey. ","tafsir":"مولانا با این تمثیل‌ها، تفاوت مردان حق را با دیگران از جهت نتیجهٔ اعمال و اختلاف آثار آن‌ها بیان می‌کند؛ او نشان می‌دهد که چگونه یک چیز به اعتبار محل، نتایج متفاوتی دارد. مثل اینکه زنبور عسل و زنبور وحشی از یک مزرعه و یک گیاه می‌چرند، اما یکی عسل می‌دهد و دیگری زهر. پس تفاوت اولیاء و منکران در عمل و خوراکشان نیست؛ زیرا چهارپایان و انسان هر دو سبزی می‌خورند. اما این سبزی در حیوان به فهم و شعور تبدیل نمی‌شود، در حالی که در وجود انسان به خرد و ادراک مبدل می‌گردد.","tafsirEn":"Through these allegories, Rumi explains the distinction between the men of God and others based on the outcomes and differing effects of their actions. He shows how the same input can yield different results depending on the vessel; just as the honeybee and the ordinary wasp feed on the same plant in the same field, yet one produces honey and the other poison. Thus, the difference between the Friends of God and the deniers lies not in their outward actions or diet, for cattle and humans both consume greens. However, this sustenance never turns into consciousness and understanding in an animal, whereas in a human, it is transformed into wisdom and intellect.","tafsirRefs":[],"reflections":[],"isShahBeyt":false,"shahBeytEn":"Don’t you compare yourself with God’s élite,\nRemember ‘souls’ just sounds like ‘soles’ of feet!","audioUrl":"https://pub-8a4a1795c6f64e5aa6236395759ee4db.r2.dev/%D8%B7%D9%88%D8%B7%DB%8C%20%D9%88%20%D8%A8%D9%82%D8%A7%D9%84%20%20%D8%A2%D8%AF%DB%8C%D9%88/1-268.mp3"},{"num":"269","text":"هر دو گون آهو گیا خوردند و آب\nزین یکی سرگین شد و زان مشک ناب‌‌\n","textErab":"هَر دو گون آهو گیا خوردَند و آب\nزین یکی سِرگین شُد و زآن مُشکِ ناب","themes":["قیاس"],"sources":[],"maana":"هر دو نوع آهو گیاه و آب خوردند، اما از یکی فضولات پدید آمد و از آن دیگری مُشکِ خالص.","maanaEn":"Both species of deer fed on the same grass and water, yet from one came dung and from the other pure musk.","tafsir":"","tafsirEn":"","tafsirRefs":[],"reflections":[],"isShahBeyt":false,"shahBeytEn":"Don’t you compare yourself with God’s élite,\nRemember ‘souls’ just sounds like ‘soles’ of feet!","audioUrl":"https://pub-8a4a1795c6f64e5aa6236395759ee4db.r2.dev/%D8%B7%D9%88%D8%B7%DB%8C%20%D9%88%20%D8%A8%D9%82%D8%A7%D9%84%20%20%D8%A2%D8%AF%DB%8C%D9%88/1-269.mp3"},{"num":"270","text":"هر دو نی خوردند از یک آب خور\nاین یکی خالی و آن پر از شکر","textErab":"هَر دو نی خوردَند از یک آب خَور\nاین یکی خالی و آن پُر از شَکَر","themes":["قیاس"],"sources":[],"maana":"هر دو نی (نیشکر و نی معمولی) از یک جا آب نوشیدند، اما این یکی تو خالی ماند و آن دیگری پر از شکر شد.","maanaEn":"Both reeds drank from the same water source, yet one remained hollow while the other filled with sugar.","tafsir":"","tafsirEn":"","tafsirRefs":[],"reflections":[],"isShahBeyt":false,"shahBeytEn":"Don’t you compare yourself with God’s élite,\nRemember ‘souls’ just sounds like ‘soles’ of feet!","audioUrl":"https://pub-8a4a1795c6f64e5aa6236395759ee4db.r2.dev/%D8%B7%D9%88%D8%B7%DB%8C%20%D9%88%20%D8%A8%D9%82%D8%A7%D9%84%20%20%D8%A2%D8%AF%DB%8C%D9%88/1-270.mp3"},{"num":"271","text":"صد هزاران این چنین اشباه بین\nفرقشان هفتاد ساله راه بین‌‌","textErab":"صَد هِزاران این چُنین اَشباه بین\nفَرقشان هَفتاد ساله راه بین","themes":["قیاس"],"sources":[],"maana":"صدها هزار از این‌گونه شبیه‌های به هم را ببین، و بنگر که فاصله و فرق میان آن‌ها به اندازه هفتاد سال راه است.","maanaEn":"Look at hundreds of thousands of such (outward) resemblances, yet know that the difference between them is (as great as) seventy years of road apart.","tafsir":"همه انسان‌ها در ظاهر و صورت جسمانی شبیه به هم هستند. اما تفاوت اصلی در نیات و صفات آن‌هاست. در قیامت، انسان‌ها بر اساس نیات و صفات خود که محصول اعمالشان است محشور می‌شوند؛ به طوری که برخی به صورت زیبا و برخی به صورت حیواناتی چون میمون و خنزیر (خوک) ظاهر خواهند شد[1][2]. قرآن کریم گروهی از انسان‌ها را که از عقل و چشم و گوش باطنی خود بهره‌ای ندارند، دقیقاً با همین تعابیر توصیف کرده است[3][4].","tafsirEn":"All human beings share a similar physical and outward appearance. However, their true distinction lies within their intentions and traits. In the Hereafter, humans will be resurrected according to their inner realities and spiritual characteristics formed through their actions; thus, some will appear in beautiful forms, while others will manifest as animals such as apes and swine[1][2]. The Holy Quran describes those who fail to utilize their intellect and inner sight and hearing in precisely these terms[3][4].","tafsirRefs":[{"type":"quran","surah":"5","ayah":"60","book":"","num":"","textAr":"مَن لَّعَنَهُ ٱللَّهُ وَ غَضِبَ عَلَيْهِ وَ جَعَلَ مِنْهُمُ ٱلْقِرَدَةَ وَ ٱلْخَنَازِيرَ","noteFa":"همانان كه خدا لعنتشان كرده و بر آنان خشم گرفته و از آنان بوزينگان و خوكان پديد آورده.","noteEn":"those who earned God’s condemnation and displeasure—some being reduced to apes and pigs.","id":1},{"type":"quran","surah":"7","ayah":"166","book":"","num":"","textAr":"فَلَمَّا عَتَوْا۟ عَن مَّا نُهُوا۟ عَنْهُ قُلْنَا لَهُمْ كُونُوا۟ قِرَدَةً خَـٰسِـِٔينَ","noteFa":"و چون از آنچه از آن نهى شده بودند سرپيچى كردند به آنان گفتيم بوزينگانى رانده‏ شده باشيد.","noteEn":"But when they stubbornly persisted in violation, We said to them, “Be disgraced apes!”","id":2},{"type":"quran","surah":"7","ayah":"179","book":"","num":"","textAr":"وَ لَقَدْ ذَرَأْنَا لِجَهَنَّمَ كَثِيرًۭا مِّنَ ٱلْجِنِّ وَ ٱلْإِنسِ ۖ لَهُمْ قُلُوبٌۭ لَّا يَفْقَهُونَ بِهَا وَ لَهُمْ أَعْيُنٌۭ لَّا يُبْصِرُونَ بِهَا وَ لَهُمْ ءَاذَانٌۭ لَّا يَسْمَعُونَ بِهَآ ۚ أُو۟لَـٰٓئِكَ كَٱلْأَنْعَـٰمِ بَلْ هُمْ أَضَلُّ ۚ أُو۟لَـٰٓئِكَ هُمُ ٱلْغَـٰفِلُونَ","noteFa":"و در حقيقت بسيارى از جنيان و آدميان را براى دوزخ آفريده‏ ايم [چرا كه] دلهايى دارند كه با آن [حقايق را] دريافت نمى كنند و چشمانى دارند كه با آنها نمى ‏بينند و گوشهايى دارند كه با آنها نمى ‏شنوند آنان همانند چهارپايان بلكه گمراه‏ ترند [آرى] آنها همان غفلت زدگان هستند.","noteEn":"Indeed, We have destined many jinn and humans for Hell. They have hearts they do not understand with, eyes they do not see with, and ears they do not hear with. They are like cattle. In fact, they are even less guided! Such ˹people˺ are ˹entirely˺ heedless.","id":3},{"type":"quran","surah":"25","ayah":"44","book":"","num":"","textAr":"أَمْ تَحْسَبُ أَنَّ أَكْثَرَهُمْ يَسْمَعُونَ أَوْ يَعْقِلُونَ ۚ إِنْ هُمْ إِلَّا كَٱلْأَنْعَـٰمِ ۖ بَلْ هُمْ أَضَلُّ سَبِيلًا","noteFa":"يا گمان دارى كه بيشترشان مى ‏شنوند يا مى‏ انديشند آنان جز مانند حیوانات نيستند بلكه گمراه‏ ترند.","noteEn":"Do you think that most of them can hear or understand? They are like cattle, no, they are further astray from the Path.","id":4}],"reflections":[],"isShahBeyt":true,"shahBeytEn":"With false comparisons this world is packed,\nNotice how different each one is in fact.","audioUrl":"https://pub-8a4a1795c6f64e5aa6236395759ee4db.r2.dev/%D8%B7%D9%88%D8%B7%DB%8C%20%D9%88%20%D8%A8%D9%82%D8%A7%D9%84%20%20%D8%A2%D8%AF%DB%8C%D9%88/1-271.mp3"},{"num":"272","text":"این خورد گردد پلیدی زو جدا\nآن خورد گردد همه نور خدا\n","textErab":"این خورَد گَردَد پَلیدی زو جُدا\nآن خورَد گَردَد هَمه نورِ خُدا","themes":["قیاس"],"sources":[],"maana":"یکی (منکران و گمراهان) می‌خورد و از او پلیدی و ناپاکی صادر می‌گردد، دیگری (انبیاء و اولیاء) می‌خورد و تمام وجودش نورِ خدا می‌گردد.","maanaEn":"One (the misguided and deniers) eats and from it filth and impurity is discharged, the other (the prophets and saints) eats and its entire being becomes the light of God.","tafsir":"آب و غذای مادی و معنوی (ورودی) ممکن است برای همه انسان‌ها یکی باشد، اما ظرفیت یا زمین وجود انسان‌ها (قابلیت‌ها) با هم فرق دارد و به همین خاطر آثار و نتایج (خروجی) متفاوتی از یک خوراک یکسان می‌تواند ظهور کند. برای مثال، قرآن که غذای روح است برای مؤمنان موجب فزونی ایمان است ولی برای کسانی که قلب‌هایشان بیمار است پلیدی بر پلیدی‌شان می‌افزاید[1].","tafsirEn":"Material and spiritual food and water (the input) may be the same for all human beings. However, people's inner capacity or the 'soil' of their existence (their potential) varies, which is why different outcomes and results (the output) can emerge from the exact same nourishment. For example, the Quran, which is food for the soul, increases the faith of believers, but for those whose hearts are diseased, it only adds wickedness to their wickedness[1].","tafsirRefs":[{"type":"quran","surah":"9","ayah":"124","book":"","num":"","textAr":"و َإِذَا مَآ أُنزِلَتْ سُورَةٌۭ فَمِنْهُم مَّن يَقُولُ أَيُّكُمْ زَادَتْهُ هَـٰذِهِۦٓ إِيمَـٰنًۭا ۚ فَأَمَّا ٱلَّذِينَ ءَامَنُوا۟ فَزَادَتْهُمْ إِيمَـٰنًۭا وَ هُمْ يَسْتَبْشِرُونَ ١٢٤ وَ أَمَّا ٱلَّذِينَ فِى قُلُوبِهِم مَّرَضٌۭ فَزَادَتْهُمْ رِجْسًا إِلَىٰ رِجْسِهِمْ وَ مَاتُوا۟ وَ هُمْ كَـٰفِرُونَ ١٢٥","noteFa":"و چون سوره‏‌اى نازل شود از ميان آنان كسى است كه مى‏‌گويد اين [سوره] ايمان كدام يك از شما را افزود اما كسانى كه ايمان آورده‏‌اند بر ايمانشان مى‏‌افزايد و آنان شادمانى مى‌كنند. اما كسانى كه در دلهايشان بيمارى است پليدى بر پليديشان افزود و در حال كفر درمى‏‌گذرند.","noteEn":"Whenever a sûrah is revealed, some of them ask ˹mockingly˺, “Which of you has this increased in faith?” As for the believers, it has increased them in faith and they rejoice. But as for those with sickness in their hearts, it has increased them only in wickedness upon their wickedness, and they die as disbelievers.","id":1}],"reflections":[],"isShahBeyt":false,"shahBeytEn":"With false comparisons this world is packed,\nNotice how different each one is in fact.","audioUrl":"https://pub-8a4a1795c6f64e5aa6236395759ee4db.r2.dev/%D8%B7%D9%88%D8%B7%DB%8C%20%D9%88%20%D8%A8%D9%82%D8%A7%D9%84%20%20%D8%A2%D8%AF%DB%8C%D9%88/1-272.mp3"},{"num":"273","text":"این خورد زاید همه بخل و حسد\nو آن خورد زاید همه نور احد\n","textErab":"این خورَد زایَد هَمه بُخل و حَسَد\nو آن خورَد زایَد هَمه نورِ اَحَد","themes":["قیاس"],"sources":[],"maana":"یکی می‌خورد و از او فقط بخل و حسد زاده می‌شود، و دیگری می‌خورد و از او فقط عشق خداوندِ بی‌همتا پدیدار می‌گردد.","maanaEn":"One eats and (of him) only envy and miserliness are born, the other eats and (of him) only the light of the One (God) shines forth.","tafsir":"مثال قرآنی دیگر اینکه انسان‌های فرشته صفت وقتی از آب معارف قرآن می‌نوشند، برایشان موجب هدایت، شفا و رحمت است. اما انسان‌های دیو صفت وقتی از همان آب می‌نوشند جز بر خسارت و گمراهی‌شان نمی‌افزاید[1][2].","tafsirEn":"As another Quranic example, when angel-natured souls drink from the waters of Quranic wisdom, it becomes for them guidance, healing, and mercy. Yet when devil-natured souls drink from that very same water, it only increases their loss and misguidance[1][2].","tafsirRefs":[{"type":"quran","surah":"17","ayah":"82","book":"","num":"","textAr":"وَ نُنَزِّلُ مِنَ ٱلْقُرْءَانِ مَا هُوَ شِفَآءٌۭ وَ رَحْمَةٌۭ لِّلْمُؤْمِنِينَ ۙ وَ لَا يَزِيدُ ٱلظَّـٰلِمِينَ إِلَّا خَسَارًۭا","noteFa":"و ما آنچه را براى مؤمنان مايه درمان و رحمت است از قرآن نازل مى ‏كنيم و[لى] ستمگران را جز زيان نمى‏ افزايد.","noteEn":"We send down the Quran as a healing and mercy for the believers, but it only increases the wrongdoers in loss.","id":1},{"type":"quran","surah":"2","ayah":"26","book":"","num":"","textAr":"يُضِلُّ بِهِۦ كَثِيرًۭا وَ يَهْدِى بِهِۦ كَثِيرًۭا ۚ وَ مَا يُضِلُّ بِهِۦٓ إِلَّا ٱلْفَـٰسِقِينَ","noteFa":"[خدا] بسيارى را با آن گمراه و بسيارى را با آن راهنمايى مى ‏كند و[لى] جز نافرمانان را با آن گمراه نمى ‏كند.","noteEn":"Through this ˹test˺, He leaves many to stray, and guides many. And He leaves none to stray except the rebellious.","id":2}],"reflections":[],"isShahBeyt":false,"shahBeytEn":"With false comparisons this world is packed,\nNotice how different each one is in fact.","audioUrl":"https://pub-8a4a1795c6f64e5aa6236395759ee4db.r2.dev/%D8%B7%D9%88%D8%B7%DB%8C%20%D9%88%20%D8%A8%D9%82%D8%A7%D9%84%20%20%D8%A2%D8%AF%DB%8C%D9%88/1-273.mp3"},{"num":"274","text":"این زمین پاک و آن شوره ست و بد\nاین فرشته‌‌ی پاک و آن دیو است و دد\n","textErab":"این زَمین پاک و آن شوره‌ ست و بَد\nاین فِرِشتِه‌ی پاک و آن دیو است و دَد","themes":["قیاس"],"sources":[{"type":"quran","surah":"7","ayah":"58","book":"","num":"","textAr":"وَ ٱلْبَلَدُ ٱلطَّيِّبُ يَخْرُجُ نَبَاتُهُۥ بِإِذْنِ رَبِّهِۦ ۖ وَ ٱلَّذِى خَبُثَ لَا يَخْرُجُ إِلَّا نَكِدًۭا ","note":"و زمين پاك [و آماده] گياهش به اذن پروردگارش برمى ‏آيد و آن [زمينى] كه ناپاك [و نامناسب] است [گياهش] جز اندك و بى‏فايده برنمى ‏آيد.","noteEn":"The fertile land produces abundantly by the Will of its Lord, whereas the infertile land hardly produces anything."}],"maana":" یکی زمین پاک (حاصل‌خیز) است و دیگری شوره‌زار و بی‌ثمر؛ یکی فرشته‌ای پاک است و دیگری دیو و حیوان درنده.","maanaEn":"One is pure (fertile) soil while the other barren and corrupt; one is a pure angel while the other a devil and a wild beast.","tafsir":"این بیت هم مَثَلی برای درک تفاوت باطنی انسان‌ها در عین شباهت ظاهری آن‌هاست. زمین پاک یا طیب  همانند وجودِ انبیاء و اولیاء الهی است. وقتی باران رحمت بر آن‌ها می‌بارد، به دلیل صفا و پاکی باطنشان، ثمره‌ای شیرین و پربار (معرفت و هدایت) به بار می‌آورند. زمین ناپاک یا شوره زار همانند وجود گمراهان و منکران است. آن‌ها نیز همان باران را دریافت می‌کنند و در ظاهرِ زمین بودن با زمین پاک مشترک هستند، اما به دلیل ناپاکی باطن، چیزی جز خار و خاشاک از آن‌ها رویش نمی‌کند.","tafsirEn":"This verse too is as a parable to understand the inner differences among humans despite their outward resemblance. The pure or fertile land represents the existence of the prophets and saints; when the rain of mercy falls upon them, their inward purity and clarity causes them to bear sweet and abundant fruit (e.g., knowledge and guidance). Conversely, the impure land or barren salt flats represents the existence of the misguided and the deniers. They receive the exact same rain and share the outward characteristic of being land with the fertile soil, yet because of their inner impurity, nothing grows from them but thorns and weeds.","tafsirRefs":[],"reflections":[],"isShahBeyt":false,"shahBeytEn":"With false comparisons this world is packed,\nNotice how different each one is in fact.","audioUrl":"https://pub-8a4a1795c6f64e5aa6236395759ee4db.r2.dev/%D8%B7%D9%88%D8%B7%DB%8C%20%D9%88%20%D8%A8%D9%82%D8%A7%D9%84%20%20%D8%A2%D8%AF%DB%8C%D9%88/1-274.mp3"},{"num":"275","text":"هر دو صورت گر بهم ماند رواست\nآب تلخ و آب شیرین را صفاست‌‌\n","textErab":"هَر دو صورَت گَر بِهَم مانَد رَواست\nآبِ تَلخ و آبِ شیرین را صَفاست","themes":["قیاس"],"sources":[],"maana":"اگر هر دو در ظاهر به هم شبیه باشند جای تعجب نیست، چرا که آب تلخ و آب شیرین هم (به یک اندازه) شفاف و زلال‌اند.","maanaEn":"It is no wonder if they both appear alike (in outward form), for bitter water and sweet water share (the same) clarity.","tafsir":"این دو آب در نگاه اول و از نظر ویژگی‌های ظاهری هیچ تفاوتی با هم ندارند و هر دو در صفتِ «آب بودن» و داشتن صفا مشترک هستند، اما تفاوتِ اصلی و حقیقیِ آن‌ها زمانی آشکار و معلوم می‌شود که چشیده شوند؛ آن‌وقت است که باطنِ شیرین و گوارای یکی و باطن تلخ و ناگوارِ دیگری مشخص می‌گردد.","tafsirEn":"At first glance, these two waters show no difference in their outward appearance; both share the quality of being water and possess the same clarity. However, their true and essential difference becomes clear only when they are tasted. It is then that the sweet, refreshing nature of one and the bitter, unpleasant essence of the other are revealed.","tafsirRefs":[],"reflections":[],"isShahBeyt":false,"shahBeytEn":"With false comparisons this world is packed,\nNotice how different each one is in fact.","audioUrl":"https://pub-8a4a1795c6f64e5aa6236395759ee4db.r2.dev/%D8%B7%D9%88%D8%B7%DB%8C%20%D9%88%20%D8%A8%D9%82%D8%A7%D9%84%20%20%D8%A2%D8%AF%DB%8C%D9%88/1-275.mp3"},{"num":"276","text":"جز که صاحب ذوق کی شناسد بیاب\nاو شناسد آب خوش از شوره آب‌‌\n","textErab":"جُز که صاحِب ذوق کِی شناسَد بِیاب\nاو شناسَد آبِ خوش از شوره‌آب","themes":["قیاس","فُرقان"],"sources":[],"maana":"جز انسان دارای قوه چشایی یا ذائقه چه کسی می‌تواند (فرقِ مزه این دو آب را) تشخیص دهد؟ (فقط) اوست که آب گوارا را از آب شور باز می‌شناسد.","maanaEn":"Who but a person of true taste can discern it (the difference)? Go find such a one, for (only) he can distinguish sweet water from the brine.","tafsir":"همان‌طور که فقط یک نفر با ذائقه یا چشاییِ سالم می‌تواند مزه‌ی آب شور را از شیرین تشخیص دهد، تنها کسی تفاوت انسان کامل و ناقص را می فهمد که ذوقِ معرفت یا توانایی تشخیص حق از باطل را داشته باشد.","tafsirEn":"Just as only someone with a healthy sense of taste can distinguish sweet water from bitter, only a person possessing spiritual intuition (zawq), or the capacity to discern truth from falsehood, can perceive the difference between a perfect and an imperfect human being.","tafsirRefs":[],"reflections":[],"isShahBeyt":false,"shahBeytEn":"With false comparisons this world is packed,\nNotice how different each one is in fact.","audioUrl":"https://pub-8a4a1795c6f64e5aa6236395759ee4db.r2.dev/%D8%B7%D9%88%D8%B7%DB%8C%20%D9%88%20%D8%A8%D9%82%D8%A7%D9%84%20%20%D8%A2%D8%AF%DB%8C%D9%88/1-276.mp3"},{"num":"277","text":"سحر را با معجزه کرده قیاس\nهر دو را بر مکر پندارد اساس‌‌\n","textErab":"سِحر را با مُعجزه کَرده قِیاس\nهَر دو را بَر مَکر پِندارد اَساس","themes":["قیاس"],"sources":[{"type":"quran","surah":"10","ayah":"76","book":"","num":"","textAr":"فَلَمَّا جَآءَهُمُ ٱلْحَقُّ مِنْ عِندِنَا قَالُوٓا۟ إِنَّ هَـٰذَا لَسِحْرٌۭ مُّبِينٌۭ","note":"پس چون حق از نزد ما به سويشان آمد گفتند قطعا اين سحرى آشكار است.","noteEn":"When the truth came to them from Us, they said, “This is certainly pure magic!”"},{"type":"quran","surah":"20","ayah":"63","book":"","num":"","textAr":"قَالُوٓا۟ إِنْ هَـٰذَٰنِ لَسَـٰحِرَٰنِ","note":"[فرعونيان] گفتند قطعا اين دو تن ساحرند.","noteEn":"They concluded, These two are only magicians..."}],"maana":"(انسان بی‌ذوق) سحر را با معجزه (یکی دانسته و) قیاس کرده، و پایه و اساس هر دو را بر مکر و فریب می‌پندارد.","maanaEn":"He (the ignorant one) has measured magic against (prophetic) miracle, (wrongly) assuming that both are rooted in trickery and deceit.","tafsir":"","tafsirEn":"","tafsirRefs":[],"reflections":[{"fa":"آیا تو نیز گاه، به معجزات انبیاء شک می کنی و  کاری که از سرِ صدق و وحی برخاسته را با فریب و مکر یکسان می‌پنداری حال آنکه موسی به ساحران فرمود تفاوتِ حقیقت با سراب، در باطل‌پذیری و بطلان‌ناپذیری آن‌هاست؟","en":"Do you, too, sometimes doubt the miracles of the prophets, equating something born out of truth and revelation with mere trickery and deceit? Yet, Moses told the magicians that the difference between reality and an illusion lies in what is susceptible to falsehood and what stands imperishable.","refs":[{"type":"quran","surah":"10","ayah":"81","book":"","num":"","textAr":"فَلَمَّآ أَلْقَوْا۟ قَالَ مُوسَىٰ مَا جِئْتُم بِهِ ٱلسِّحْرُ ۖ إِنَّ ٱللَّهَ سَيُبْطِلُهُۥٓ ","noteFa":"پس چون افكندند موسى گفت آنچه را شما به ميان آورديد سحر است به زودى خدا آن را باطل خواهد كرد.","noteEn":"When they did, Moses said, “What you have produced is mere magic, God will surely make it useless,"}]}],"isShahBeyt":false,"shahBeytEn":"With false comparisons this world is packed,\nNotice how different each one is in fact.","audioUrl":"https://pub-8a4a1795c6f64e5aa6236395759ee4db.r2.dev/%D8%B7%D9%88%D8%B7%DB%8C%20%D9%88%20%D8%A8%D9%82%D8%A7%D9%84%20%20%D8%A2%D8%AF%DB%8C%D9%88/1-277.mp3"},{"num":"278","text":"ساحران موسی از استیزه را\nبر گرفته چون عصای او عصا\n","textErab":"ساحِرانِ موسی از اِستیزه را\nبَرگِرِفته چون عَصایِ او عَصا","themes":["قیاس"],"sources":[{"type":"quran","surah":"20","ayah":"65","book":"","num":"","textAr":"قَالُوا۟ يَـٰمُوسَىٰٓ إِمَّآ أَن تُلْقِىَ و َإِمَّآ أَن نَّكُونَ أَوَّلَ مَنْ أَلْقَىٰ","note":"[ساحران] گفتند اى موسى يا تو مى‏ افكنى يا [ما] نخستين كس باشيم كه مى اندازيم.","noteEn":"They said, “O Moses! Either you cast, or let us be the first to cast.”"}],"maana":"ساحرانِ (زمانِ) موسی از روی دشمنی و ستیز، عصاهایی مانند عصای او بدست گرفتند.","maanaEn":"The sorcerers (in the time) of Moses, out of defiance, took up their rods just as Moses had taken up his. ","tafsir":"","tafsirEn":"","tafsirRefs":[],"reflections":[],"isShahBeyt":false,"shahBeytEn":"With false comparisons this world is packed,\nNotice how different each one is in fact.","audioUrl":"https://pub-8a4a1795c6f64e5aa6236395759ee4db.r2.dev/%D8%B7%D9%88%D8%B7%DB%8C%20%D9%88%20%D8%A8%D9%82%D8%A7%D9%84%20%20%D8%A2%D8%AF%DB%8C%D9%88/1-278.mp3"},{"num":"279","text":"زین عصا تا آن عصا فرقی است ژرف\nزین عمل تا آن عمل راهی شگرف‌‌\n","textErab":"زین عَصا تا آن عَصا فَرقی‌ست ژَرف\nزین عَمَل تا آن عَمَل راهی شِگَرف","themes":["قیاس"],"sources":[],"maana":"بین عصای موسی وعصای ساحران تفاوتی ژرف و عمیق است، و از عمل ساحران (جادو) تا عمل حضرت موسی (معجزه) راهی شگفت و بس دراز است.","maanaEn":"(But) between this rod and that rod lies a vast difference, and from this action (magic) to that action (miracle) is a wondrous distance.","tafsir":"فرق میان سحر و معجزه آن است که سحر در خیال صورت می‌گیرد و دیدگان اهل ظاهر را فریب می‌دهد[1] ولی معجزه در خارج واقع می‌شود[2] و قلب‌های آماده را خاضع می‌کند[3]. سحر فقط با توسل به ابزار و قدرت‌های مادی  صورت می‌گیرد[4] ولی معجزه به مدد وحی الهی واقع می‌شود[5]. و در نهایت معجزه حق است و سحر باطل[6] و ساحر هر کجا که باشد رستگار نمی‌شود[7].","tafsirEn":"The difference between magic and miracle is that magic takes place in the realm of imagination, deceiving the eyes of those who see only the outward surface[1], while miracle occurs in reality[2] and brings hearts that are ready to their knees in humility[3]. magic works only by resorting to material instruments and worldly powers[4], while miracle comes to pass through divine revelation[5]. And in the end, miracle is truth while magic is falsehood[6], and the magician, wherever he may be, shall never succeed[7].","tafsirRefs":[{"type":"quran","surah":"7","ayah":"116","book":"","num":"","textAr":"قَالَ أَلْقُوا۟ ۖ فَلَمَّآ أَلْقَوْا۟ سَحَرُوٓا۟ أَعْيُنَ ٱلنَّاسِ وَ ٱسْتَرْهَبُوهُمْ وَ جَآءُو بِسِحْرٍ عَظِيمٍ","noteFa":"گفت‏ شما بيفكنيد و چون افكندند ديدگان مردم را افسون كردند و آنان را به ترس انداختند و سحرى بزرگ در ميان آوردند.","noteEn":"Moses said, “You first.” So when they did, they deceived the eyes of the people, stunned them, and made a great display of magic.","id":1},{"type":"quran","surah":"26","ayah":"45","book":"","num":"","textAr":"فَأَلْقَىٰ مُوسَىٰ عَصَاهُ فَإِذَا هِىَ تَلْقَفُ مَا يَأْفِكُونَ","noteFa":"پس موسى عصايش را انداخت و بناگاه هر چه را به دروغ برساخته بودند بلعيد.","noteEn":"Then Moses threw down his staff, and—behold!—it devoured the objects of their illusion!","id":2},{"type":"quran","surah":"20","ayah":"70","book":"","num":"","textAr":"فَأُلْقِىَ ٱلسَّحَرَةُ سُجَّدًۭا قَالُوٓا۟ ءَامَنَّا بِرَبِّ هَـٰرُونَ وَمُوسَىٰ","noteFa":"پس ساحران به سجده درافتادند گفتند به پروردگار موسى و هارون ايمان آورديم.","noteEn":"So the magicians fell down in prostration, declaring, “We believe in the Lord of Aaron and Moses.”","id":3},{"type":"quran","surah":"26","ayah":"44","book":"","num":"","textAr":"فَأَلْقَوْا۟ حِبَالَهُمْ وَ عِصِيَّهُمْ وَ قَالُوا۟ بِعِزَّةِ فِرْعَوْنَ إِنَّا لَنَحْنُ ٱلْغَـٰلِبُونَ","noteFa":"پس ريسمانها و چوبدستى‏ هايشان را انداختند و گفتند به عزت فرعون كه ما حتما پيروزيم.","noteEn":"So they cast down their ropes and staffs, saying, “By Pharaoh’s might, it is we who will surely prevail.”","id":4},{"type":"quran","surah":"7","ayah":"117","book":"","num":"","textAr":"وَ أَوْحَيْنَآ إِلَىٰ مُوسَىٰٓ أَنْ أَلْقِ عَصَاكَ ","noteFa":"و به موسى وحى كرديم كه عصايت را بينداز.","noteEn":"Then We revealed to Moses, “Throw down your staff,”","id":5},{"type":"quran","surah":"7","ayah":"118","book":"","num":"","textAr":"فَوَقَعَ ٱلْحَقُّ وَ بَطَلَ مَا كَانُوا۟ يَعْمَلُونَ","noteFa":"پس حقيقت آشكار گرديد و كارهايى كه میکردند باطل شد","noteEn":"So the truth prevailed and their illusions failed.","id":6},{"type":"quran","surah":"20","ayah":"69","book":"","num":"","textAr":"وَ لَا يُفْلِحُ ٱلسَّاحِرُ حَيْثُ أَتَىٰ","noteFa":"و افسونگر هر جا برود رستگار نمى شود.","noteEn":"And magicians can never succeed wherever they go.","id":7}],"reflections":[{"fa":"آیا گمان می‌بری کوششِ منافق با کوشش مؤمنِ صادق، یکسان است حال آنکه خداوند می‌فرماید: همانا کوشش‌های شما [در نیت و سرانجام] بسیار متفاوت و پراکنده است؟","en":"Do you think the effort of a hypocrite is the same as the effort of a sincere believer, while God says: 'Surely, your efforts are diverse [in intention and outcome]'?","refs":[{"type":"quran","surah":"92","ayah":"4","book":"","num":"","textAr":"إِنَّ سَعْيَكُمْ لَشَتَّىٰ","noteFa":"همانا تلاش شما پراكنده است.","noteEn":"Surely the ends you strive for are diverse."}]}],"isShahBeyt":false,"shahBeytEn":"With false comparisons this world is packed,\nNotice how different each one is in fact.","audioUrl":"https://pub-8a4a1795c6f64e5aa6236395759ee4db.r2.dev/%D8%B7%D9%88%D8%B7%DB%8C%20%D9%88%20%D8%A8%D9%82%D8%A7%D9%84%20%20%D8%A2%D8%AF%DB%8C%D9%88/1-279.mp3"},{"num":"280","text":"لعنة الله این عمل را در قفا\nرحمه الله آن عمل را در وفا \n","textErab":"لَعنَةُ الله این عَمَل را در قَفا\nرَحمَةُ الله آن عَمَل را در وَفا","themes":["قیاس"],"sources":[],"maana":"این عمل (سحر) لعنت خدا را به همراه دارد، ولی پاداشِ بجا آوردن آن عمل (معجزه)  رحمتِ خدا خواهد بود.","maanaEn":"God’s curse follows upon this action (sorcery), (whereas) God’s mercy (blessing) is granted in reward for that action.","tafsir":"مولانا در این ابیات، تفاوت میان کارِ یک انسانِ کامل و یک انسانِ ناقص را از نظر نیت و عاقبت  نشان می‌دهد. او برای روشن شدن موضوع، از داستان حضرت موسی و ساحران فرعون مثال می‌آورد. در ظاهر، کاری که ساحران انجام دادند (ریسمان‌هایی که به شکل مار درآمدند) با کاری که حضرت موسی کرد (تبدیل شدن عصا به اژدها) شبیه به هم بود؛ اما در باطن، فرسنگ‌ها با یکدیگر تفاوت داشت. کار ساحران به دستور فرعون و برای خوشایند او بود و نتیجه‌ای جز دوری از رحمت خدا نداشت[1]. ولی کار حضرت موسی به فرمان الهی بود و برای خشنودی او بود و موجب هدایت، ایمان و تقرب به خداوند شد[2]. ","tafsirEn":"In these verses, Rumi illustrates the difference between the deeds of a perfect human being and those of an imperfect one, in terms of both intention and ultimate outcome. To clarify the matter, he draws on the story of Moses and the sorcerers of Pharaoh. Outwardly, what the sorcerers did (ropes that took the form of serpents) resembled what Moses did (a staff transformed into a dragon). Yet inwardly, the two were worlds apart. The sorcerers acted by Pharaoh's command and to satisfy him and led to nothing but distance from God's mercy[1]. Moses, by contrast, acted by divine command and to please Him, and became a cause of guidance, faith, and drawing closer to God[2].","tafsirRefs":[{"type":"quran","surah":"11","ayah":"99","book":"","num":"","textAr":"و َأُتْبِعُوا۟ فِى هَـٰذِهِۦ لَعْنَةًۭ وَ يَوْمَ ٱلْقِيَـٰمَةِ ۚ بِئْسَ ٱلرِّفْدُ ٱلْمَرْفُودُ","noteFa":"و در اين دنيا و روز قيامت به لعنت بدرقه شدند و چه بد عطايى نصيب آنان مى ‏شود.","noteEn":"They were followed by a curse in this ˹life˺ and ˹will receive another˺ on the Day of Judgment. What an evil gift to receive!","id":1},{"type":"quran","surah":"26","ayah":"51","book":"","num":"","textAr":"إِنَّا نَطْمَعُ أَن يَغْفِرَ لَنَا رَبُّنَا خَطَـٰيَـٰنَآ أَن كُنَّآ أَوَّلَ ٱلْمُؤْمِنِينَ","noteFa":"ما اميدواريم كه پروردگارمان گناهانمان را بر ما ببخشايد [چرا] كه نخستين ايمان‏ آورندگان بوديم.","noteEn":"We really hope that our Lord will forgive our sins, as we are the first to believe.","id":2}],"reflections":[],"isShahBeyt":false,"shahBeytEn":"With false comparisons this world is packed,\nNotice how different each one is in fact.","audioUrl":"https://pub-8a4a1795c6f64e5aa6236395759ee4db.r2.dev/%D8%B7%D9%88%D8%B7%DB%8C%20%D9%88%20%D8%A8%D9%82%D8%A7%D9%84%20%20%D8%A2%D8%AF%DB%8C%D9%88/1-280.mp3"},{"num":"281","text":"کافران اندر مری بوزینه طبع\nآفتی آمد درون سینه طبع‌‌","textErab":"کافِران اندَر مِری بوزینه طَبع\nآفَتی آمَد درونِ سینه طَبع","themes":["قیاس","تقلید"],"sources":[],"maana":"کافران در لجاجت و ستیزه‌جویی‌ طبیعتی چون بوزینه (میمون) دارند، و سرشت (حیوانی) آفتی است که درونِ سینهٔ آن‌ها نهفته است. ","maanaEn":"In their stubborn defiance, unbelievers possess the nature of an ape, and an (evil) disposition has become a canker within (their) breasts.","tafsir":"کنایه است از اینکه کافران کارشان مثل میمون صرفاً تقلیدِ کورکورانه از آبا و اجدادشان است[1] واین آفت و بلای بزرگی است که هر کس هر چه ملایمِ سرشت او باشد نسبت به آن تمایل نشان می‌دهد و از آن تقلید می‌کند.","tafsirEn":"This serves as an allusion to how infidels act like apes, engaging in nothing but the blind imitation of their forefathers[1]. This is a great affliction and plague, wherein every individual is naturally drawn to and copies whatever conforms to their inherent temperament.","tafsirRefs":[{"type":"quran","surah":"5","ayah":"104","book":"","num":"","textAr":"وَ إِذَا قِيلَ لَهُمْ تَعَالَوْا۟ إِلَىٰ مَآ أَنزَلَ ٱللَّهُ وَ إِلَى ٱلرَّسُولِ قَالُوا۟ حَسْبُنَا مَا وَجَدْنَا عَلَيْهِ ءَابَآءَنَآ ۚ أَوَ لَوْ كَانَ ءَابَآؤُهُمْ لَا يَعْلَمُونَ شَيْـًۭٔا وَ لَا يَهْتَدُونَ","noteFa":"و چون به آنان گفته شود به سوى آنچه خدا نازل كرده و به سوى پيامبر[ش] بياييد مى‏ گويند آنچه پدران خود را بر آن يافته‏ ايم ما را بس است آيا هر چند پدرانشان چيزى نمى‏ دانسته و هدايت نيافته بودند؟","noteEn":"When it is said to them, “Come to God’s revelations and to the Messenger,” they reply, “What we found our forefathers practicing is good enough for us.” ˹Would they still do so,˺ even if their forefathers had absolutely no knowledge or guidance?","id":1}],"reflections":[{"fa":"آیا کسانی که آفتی یا بیماری در دل‌هایشان است، می‌پندارند خدا هرگز آن آفت‌ها را آشکار نخواهد ساخت؟","en":"Do those in whose hearts is a disease think that God will never bring them forth?","refs":[{"type":"quran","surah":"47","ayah":"29","book":"","num":"","textAr":"أَمْ حَسِبَ ٱلَّذِينَ فِى قُلُوبِهِم مَّرَضٌ أَن لَّن يُخْرِجَ ٱللَّهُ أَضْغَـٰنَهُمْ","noteFa":"آيا كسانى كه در دلهايشان مرضى هست پنداشتند كه خدا هرگز كينه آنان را آشكار نخواهد كرد؟","noteEn":"Or do those with sickness in their hearts think that God will not ˹be able to˺ expose their malice?"}]}],"isShahBeyt":false,"shahBeytEn":"With false comparisons this world is packed,\nNotice how different each one is in fact.","audioUrl":"https://pub-8a4a1795c6f64e5aa6236395759ee4db.r2.dev/%D8%B7%D9%88%D8%B7%DB%8C%20%D9%88%20%D8%A8%D9%82%D8%A7%D9%84%20%20%D8%A2%D8%AF%DB%8C%D9%88/1-281.mp3"},{"num":"282","text":"هر چه مردم می‌‌کند بوزینه هم\nآن کند کز مرد بیند دم‌‌به‌‌دم‌‌\n","textErab":"هَر چه مَردُم می‌کُنَد بوزینه هَم\nآن کُنَد کز مَرد بینَد دَم‌به‌دَم","themes":["قیاس","تقلید"],"sources":[],"maana":"(مثلا) هر کاری که انسان انجام می‌دهد، میمون هم عین همان را می‌کند و آنچه را که لحظه به لحظه از انسان می‌بیند، تقلید می‌کند.","maanaEn":"Whatever a person does the monkey imitates, for it watches and follows every move the human makes moment by moment.","tafsir":"","tafsirEn":"","tafsirRefs":[],"reflections":[],"isShahBeyt":false,"shahBeytEn":"With false comparisons this world is packed,\nNotice how different each one is in fact.","audioUrl":"https://pub-8a4a1795c6f64e5aa6236395759ee4db.r2.dev/%D8%B7%D9%88%D8%B7%DB%8C%20%D9%88%20%D8%A8%D9%82%D8%A7%D9%84%20%20%D8%A2%D8%AF%DB%8C%D9%88/1-282.mp3"},{"num":"283","text":"او گمان برده که من کردم چو او\nفرق را کی داند آن استیزه رو","textErab":"او گُمان بُرده که مَن کَردَم چو او\nفَرق را کِی دانَد آن اِستیزه‌رو","themes":["قیاس","تقلید"],"sources":[],"maana":"او (میمون) گمان می‌کند که من هم مثل او کردم، اما آن موجود لجوج کِی می‌تواند تفاوت (این دو عمل) را بفهمد؟","maanaEn":"He thinks, “I have acted like him”: how should that quarrelsome-looking one know the difference?","tafsir":"","tafsirEn":"","tafsirRefs":[],"reflections":[],"isShahBeyt":false,"shahBeytEn":"With false comparisons this world is packed,\nNotice how different each one is in fact.","audioUrl":"https://pub-8a4a1795c6f64e5aa6236395759ee4db.r2.dev/%D8%B7%D9%88%D8%B7%DB%8C%20%D9%88%20%D8%A8%D9%82%D8%A7%D9%84%20%20%D8%A2%D8%AF%DB%8C%D9%88/1-283.mp3"},{"num":"284","text":"این کند از امر و او بهر ستیز\nبر سر استیزه رویان خاک ریز\n","textErab":"این کُنَد از اَمر و او بَهرِ سِتیز\nبَر سَرِ اِستیزه‌ رویان خاک ریز","themes":["قیاس","تقلید"],"sources":[{"type":"quran","surah":"18","ayah":"82","book":"","num":"","textAr":"وَ مَا فَعَلْتُهُۥ عَنْ أَمْرِى","note":"و اين [كارها] را من خودسرانه انجام ندادم.","noteEn":"I did not do it ˹all˺ by my own command."}],"maana":"این یکی (انسانِ محقق) کارش را به فرمان الهی انجام می‌دهد، و آن دیگری (میمونِ مقلد) از سر ستیز و لجاجت. خاک بر سر ستیزه‌ رویان باد.","maanaEn":"This one (the holy man) acts by (divine) command while the other (the apish imitator) out of sheer defiance; pour dust upon the heads of such stubborn defiers.","tafsir":"","tafsirEn":"","tafsirRefs":[],"reflections":[{"fa":"آیا می‌دانی چرا خداوند قلب کافران را در زیر خروارها خاک دفن می‌کند؟ چون بدونِ هیچ برهان و دلیلی به جدال و ستیز با حق برمی‌خیزند. مبادا تو نیز از آنها باشی!","en":"Do you know why God buries the hearts of disbelievers under piles of dust? It is because they argue and fight against the truth without any proof or reason. Beware, lest you become one of them!","refs":[{"type":"quran","surah":"40","ayah":"35","book":"","num":"","textAr":"ٱلَّذِينَ يُجَـٰدِلُونَ فِىٓ ءَايَـٰتِ ٱللَّهِ بِغَيْرِ سُلْطَـٰنٍ أَتَىٰهُمْ ۖ كَبُرَ مَقْتًا عِندَ ٱللَّهِ وَ عِندَ ٱلَّذِينَ ءَامَنُوا۟ ۚ كَذَٰلِكَ يَطْبَعُ ٱللَّهُ عَلَىٰ كُلِّ قَلْبِ مُتَكَبِّرٍۢ جَبَّارٍۢ","noteFa":"كسانى كه در باره آيات خدا بدون حجتى كه براى آنان آمده باشد مجادله مى‌كنند [اين ستيزه] در نزد خدا و نزد كسانى كه ايمان آورده‏‌اند [مايه] عداوت بزرگى است اين‌گونه خدا بر دل هر متكبر و زورگويى مهر مى‌‏نهد.","noteEn":"Those who dispute God’s signs with no proof given to them. How despicable is that for God and the believers! This is how God seals the heart of every arrogant tyrant."}]}],"isShahBeyt":false,"shahBeytEn":"With false comparisons this world is packed,\nNotice how different each one is in fact.","audioUrl":"https://pub-8a4a1795c6f64e5aa6236395759ee4db.r2.dev/%D8%B7%D9%88%D8%B7%DB%8C%20%D9%88%20%D8%A8%D9%82%D8%A7%D9%84%20%20%D8%A2%D8%AF%DB%8C%D9%88/1-284.mp3"},{"num":"285","text":"آن منافق با موافق در نماز\nاز پی استیزه آید نی نیاز","textErab":"آن مُنافِق با مُوافِق دَر نَماز\nاز پِیِ اِستیزه آیَد نی نِیاز","themes":["نفاق","اخلاص"],"sources":[{"type":"quran","surah":"4","ayah":"142","book":"","num":"","textAr":"إِنَّ ٱلْمُنَـٰفِقِينَ يُخَـٰدِعُونَ ٱللَّهَ وَ هُوَ خَـٰدِعُهُمْ وَ إِذَا قَامُوٓا۟ إِلَى ٱلصَّلَوٰةِ قَامُوا۟ كُسَالَىٰ يُرَآءُونَ ٱلنَّاسَ وَ لَا يَذْكُرُونَ ٱللَّهَ إِلَّا قَلِيلًۭا","note":"منافقان با خدا نيرنگ مى كنند و حال آنكه او با آنان نيرنگ خواهد كرد و چون به نماز ايستند با كسالت برخيزند با مردم ريا مى‌كنند و خدا را جز اندكى ياد نمى‌كنند.","noteEn":"Surely the hypocrites seek to deceive God, but He outwits them. When they stand up for prayer, they do it half-heartedly only to be seen by people—hardly remembering God at all."}],"maana":"آن منافق در نماز در کنار مؤمن می‌ایستد، اما نه از سر نیاز و اشتیاق (به خدا) بلکه از سر ستیز (و ریا) می‌آید.","maanaEn":"The hypocrite stands alongside the believer in prayer, yet comes not out of need (and devotion) but out of defiance (and pretence).","tafsir":"","tafsirEn":"","tafsirRefs":[],"reflections":[{"fa":"آیا می‌دانستی فاصله کفر و ایمان به باریکی کسالت در نماز و کراهت در انفاق است؟","en":"Did you know that the line between disbelief and faith is as thin as half-heartedness in prayer and reluctance in giving charity?","refs":[{"type":"quran","surah":"9","ayah":"54","book":"","num":"","textAr":"وَ مَا مَنَعَهُمْ أَن تُقْبَلَ مِنْهُمْ نَفَقَـٰتُهُمْ إِلَّآ أَنَّهُمْ كَفَرُوا۟ بِٱللَّهِ وَ بِرَسُولِهِۦ وَ لَا يَأْتُونَ ٱلصَّلَوٰةَ إِلَّا وَ هُمْ كُسَالَىٰ وَ لَا يُنفِقُونَ إِلَّا وَ هُمْ كَـٰرِهُونَ","noteFa":"و هيچ چيز مانع پذيرفته شدن انفاق‌هاى آنان نشد جز اينكه به خدا و پيامبرش كفر ورزيدند و جز با [حال] كسالت نماز به جا نمى‌‏آورند و جز با كراهت انفاق نمى‌كنند.","noteEn":"And what prevented their donations from being accepted is that they have lost faith in God and His Messenger, they never come to prayer except half-heartedly, and they never donate except reluctantly."}]}],"isShahBeyt":true,"shahBeytEn":"Although the hypocrites attend the prayer,\nIt’s just so they can start a quarrel there.","audioUrl":"https://pub-8a4a1795c6f64e5aa6236395759ee4db.r2.dev/%D8%B7%D9%88%D8%B7%DB%8C%20%D9%88%20%D8%A8%D9%82%D8%A7%D9%84%20%20%D8%A2%D8%AF%DB%8C%D9%88/1-285.mp3"},{"num":"286","text":"در نماز و روزه و حج و زکات\nبا منافق مومنان در برد و مات‌‌\n","textErab":"دَر نَماز و روزه و حَج و زَکات\nبا مُنافِق مومِنان دَر بُرد و مات","themes":["نفاق","اخلاص"],"sources":[{"type":"quran","surah":"57","ayah":"13","book":"","num":"","textAr":"يَوْمَ يَقُولُ ٱلْمُنَـٰفِقُونَ وَ ٱلْمُنَـٰفِقَـٰتُ لِلَّذِينَ ءَامَنُوا۟ ٱنظُرُونَا نَقْتَبِسْ مِن نُّورِكُمْ قِيلَ ٱرْجِعُوا۟ وَرَآءَكُمْ فَٱلْتَمِسُوا۟ نُورًۭا","note":"آن روز مردان و زنان منافق به كسانى كه ايمان آورده‏ اند مى‏ گويند ما را مهلت دهيد تا از نورتان [اندكى] برگيريم گفته مى ‏شود [به دنیا] بازپس برگرديد و نورى درخواست كنيد.","noteEn":"On that Day hypocrite men and women will beg the believers, “Wait for us so that we may have some of your light.” It will be said ˹mockingly˺, “Go back ˹to the world˺ and seek a light ˹there˺!”"}],"maana":"مؤمنان در نماز و روزه و حج و زکات با منافقان در برد و باختند.","maanaEn":"In prayer, fasting, pilgrimage and almsgiving, the believers and hypocrites are (engaged) in (a contest of) victory and defeat.","tafsir":"مؤمنان و منافقان در انجام عباداتی مثل نماز، روزه، حج و زکات در ظاهر با هم مشترک هستند، اما رابطه آن‌ها مانند یک بازی شطرنج، در حالتِ «برد و باخت» (غالب و مغلوبی) است؛ مؤمنان به خاطر ایمان حقیقی‌شان پیروز و سربلندند، در حالی که منافقان به دلیل تقلید کورکورانه، دورویی و ستیز، کیش‌ومات شده و زیان‌کارند[1].","tafsirEn":"Believers and hypocrites share the same outward acts of worship, such as prayer, fasting, pilgrimage, and charity. However, their relationship is like a game of chess, defined by 'winning and losing.' Believers emerge victorious and honored because of their genuine faith, while hypocrites, due to their blind imitation, hypocrisy and hostility, end up checkmated and at a loss[1].","tafsirRefs":[{"type":"quran","surah":"57","ayah":"13","book":"","num":"","textAr":"يَوْمَ يَقُولُ ٱلْمُنَـٰفِقُونَ وَ ٱلْمُنَـٰفِقَـٰتُ لِلَّذِينَ ءَامَنُوا۟ ٱنظُرُونَا نَقْتَبِسْ مِن نُّورِكُمْ قِيلَ ٱرْجِعُوا۟ وَرَآءَكُمْ فَٱلْتَمِسُوا۟ نُورًۭا","noteFa":"آن روز مردان و زنان منافق به كسانى كه ايمان آورده‏ اند مى‏ گويند ما را مهلت دهيد تا از نورتان [اندكى] برگيريم گفته مى ‏شود [به دنیا] بازپس برگرديد و نورى درخواست كنيد.","noteEn":"On that Day hypocrite men and women will beg the believers, “Wait for us so that we may have some of your light.” It will be said ˹mockingly˺, “Go back ˹to the world˺ and seek a light ˹there˺!”","id":1}],"reflections":[],"isShahBeyt":false,"shahBeytEn":"Although the hypocrites attend the prayer,\nIt’s just so they can start a quarrel there.","audioUrl":"https://pub-8a4a1795c6f64e5aa6236395759ee4db.r2.dev/%D8%B7%D9%88%D8%B7%DB%8C%20%D9%88%20%D8%A8%D9%82%D8%A7%D9%84%20%20%D8%A2%D8%AF%DB%8C%D9%88/1-286.mp3"},{"num":"287","text":"مومنان را برد باشد عاقبت\nبر منافق مات اندر آخرت‌‌","textErab":"مومِنان را بُرد باشَد عاقِبَت\nبَر مُنافِق مات اَندَر آخِرَت","themes":["نفاق","اخلاص"],"sources":[{"type":"quran","surah":"23","ayah":"1","book":"","num":"","textAr":"قَدْ أَفْلَحَ ٱلْمُؤْمِنُونَ","note":"به راستى كه مؤمنان رستگار شدند.","noteEn":"Successful indeed are the believers:"},{"type":"quran","surah":"4","ayah":"145","book":"","num":"","textAr":"إِنَّ ٱلْمُنَـٰفِقِينَ فِى ٱلدَّرْكِ ٱلْأَسْفَلِ مِنَ ٱلنَّارِ و َلَن تَجِدَ لَهُمْ نَصِيرًا","note":"آرى منافقان در فروترين درجات دوزخند و هرگز براى آنان ياورى نخواهى يافت.","noteEn":"Surely the hypocrites will be in the lowest depths of the Fire—and you will never find for them any helper."}],"maana":"مؤمنان را در پایان پیروزی و رستگاری است، و منافق را در آخرت شکست و مات.","maanaEn":"In the end victory belongs to the believers, and in the hereafter (defeat and) checkmate fall upon the hypocrites.","tafsir":"","tafsirEn":"","tafsirRefs":[],"reflections":[{"fa":"آیا آن روز که منافقان به مؤمنان بگویند «منتظرِ ما باشید تا از نورِ شما برگیریم» و پاسخ شنوند «[به دنیا] بازگردید و نوری بجویید» و دیواری میانشان برافراشته شود، تو در کدام سوی آن دیوار ایستاده‌ای؟ در سوی نور یا در سوی تاریکی؟","en":"On that day when the hypocrites will say to the believers, \"Wait for us, that we may take some of your light,\" and be told, \"Go back [to the world] and seek a light,\" and a wall will be raised between them, on which side of that wall do you stand? light or darkness?","refs":[{"type":"quran","surah":"57","ayah":"13","book":"","num":"","textAr":"يَوْمَ يَقُولُ ٱلْمُنَـٰفِقُونَ و َٱلْمُنَـٰفِقَـٰتُ لِلَّذِينَ ءَامَنُوا۟ ٱنظُرُونَا نَقْتَبِسْ مِن نُّورِكُمْ قِيلَ ٱرْجِعُوا۟ وَرَآءَكُمْ فَٱلْتَمِسُوا۟ نُورًۭا فَضُرِبَ بَيْنَهُم بِسُورٍۢ لَّهُۥ بَابٌۢ بَاطِنُهُۥ فِيهِ ٱلرَّحْمَةُ وَ ظَـٰهِرُهُۥ مِن قِبَلِهِ ٱلْعَذَابُ","noteFa":"آن روز مردان و زنان منافق به كسانى كه ايمان آورده‏‌اند مى‏‌گويند ما را مهلت دهيد تا از نورتان [اندكى] برگيريم گفته مى‌‏شود بازپس برگرديد و نورى درخواست كنيد آنگاه ميان آنها ديوارى زده مى‌‏شود كه آن را دروازه‏‌اى است باطنش رحمت است و ظاهرش روى به عذاب دارد.","noteEn":"On that Day hypocrite men and women will beg the believers, “Wait for us so that we may have some of your light.” It will be said ˹mockingly˺, “Go back ˹to the world˺ and seek a light ˹there˺!” Then a ˹separating˺ wall with a gate will be erected between them. On the near side will be grace and on the far side will be torment."}]}],"isShahBeyt":false,"shahBeytEn":"Although the hypocrites attend the prayer,\nIt’s just so they can start a quarrel there.","audioUrl":"https://pub-8a4a1795c6f64e5aa6236395759ee4db.r2.dev/%D8%B7%D9%88%D8%B7%DB%8C%20%D9%88%20%D8%A8%D9%82%D8%A7%D9%84%20%20%D8%A2%D8%AF%DB%8C%D9%88/1-287.mp3"},{"num":"288","text":"گر چه هر دو بر سر یک بازی‌‌اند\nهر دو با هم مروزی و رازی‌‌اند\n","textErab":"گَر چِه هَر دو بَر سَرِ یک بازی‌اَند\nهَر دو با هَم مَروزی و رازی‌اَند","themes":["نفاق","اخلاص"],"sources":[],"maana":"اگرچه مؤمن و منافق (در ظاهر) مشغول یک بازی (اعمال عبادی) هستند، اما (در حقیقت) مانند یک فردِ اهل شهر «مرو» و یک فردِ اهلِ شهرِ«ری»، (فرسنگ‌ها) از هم فاصله دارند.","maanaEn":"Although both seem to be engaged in the same game, they are as far apart from each other as a man of Merv and a man of Rayy.","tafsir":"","tafsirEn":"","tafsirRefs":[],"reflections":[],"isShahBeyt":false,"shahBeytEn":"Although the hypocrites attend the prayer,\nIt’s just so they can start a quarrel there.","audioUrl":"https://pub-8a4a1795c6f64e5aa6236395759ee4db.r2.dev/%D8%B7%D9%88%D8%B7%DB%8C%20%D9%88%20%D8%A8%D9%82%D8%A7%D9%84%20%20%D8%A2%D8%AF%DB%8C%D9%88/1-288.mp3"},{"num":"289","text":"هر یکی سوی مقام خود رود\nهر یکی بر وفق نام خود رود\n","textErab":"هَر یکی سویِ مُقامِ خود رَوَد\nهَر یکی بَر وِفقِ نامِ خود رَوَد","themes":["نفاق","اخلاص"],"sources":[{"type":"quran","surah":"17","ayah":"84","book":"","num":"","textAr":"قُلْ كُلٌّۭ يَعْمَلُ عَلَىٰ شَاكِلَتِهِۦ فَرَبُّكُمْ أَعْلَمُ بِمَنْ هُوَ أَهْدَىٰ سَبِيلًۭا","note":"بگو که هر کس بر حسب ذات و طبیعت خود عمل می‌کند، و خدای شما به آن که راهیافته‌تر است (از همه کس) آگاهتر است.","noteEn":"Say, ˹O Prophet,˺ “Everyone acts in their own way. But your Lord knows best whose way is rightly guided.”"}],"maana":"(در نهایت،) هر کدام به سوی جایگاه و مقام خود می‌رود و سرانجامِ هر کدام، مطابق با همان نام و حقیقت وی رقم می‌خورد.","maanaEn":"Each one goes  to his own (proper) station (and destination), and each one travels according to its own name (and disposition).","tafsir":"مؤمن و منافق اگرچه در ظاهر عبادات با هم شریک هستند، اما سرانجامِ یکسانی ندارند؛ منافق به خاطر تکرار کارهای ریاکارانه‌اش، روزبه‌روز در تاریکی و نفاق جلوتر می‌رود و عاقبت به پایین‌ترین درجهٔ جهنم سقوط می‌کند[1]، اما مؤمن به سبب اخلاص و تداومِ بندگی، روزبه‌روز در ایمانش قوی‌تر می‌شود و در نهایت به جایگاه ابدی خود یعنی بهشت می‌رسد[2].","tafsirEn":"Although the believer and the hypocrite appear to share the same outward acts of worship, their ultimate ends are entirely different. Through his repeated acts of duplicity, the hypocrite sinks deeper into darkness and hypocrisy day by day, eventually plummeting to the lowest depths of Hell[1]. Conversely, the believer, through sincerity and steadfast devotion, grows stronger in faith each day and ultimately reaches his eternal abode, which is Paradise[2].","tafsirRefs":[{"id":1,"type":"quran","surah":"4","ayah":"145","book":"","num":"","textAr":"إِنَّ ٱلْمُنَـٰفِقِينَ فِى ٱلدَّرْكِ ٱلْأَسْفَلِ مِنَ ٱلنَّارِ و َلَن تَجِدَ لَهُمْ نَصِيرًا","noteFa":"آرى منافقان در فروترين درجات دوزخند و هرگز براى آنان ياورى نخواهى يافت.","noteEn":"Surely the hypocrites will be in the lowest depths of the Fire—and you will never find for them any helper."},{"id":2,"type":"quran","surah":"9","ayah":"72","book":"","num":"","textAr":"وَعَدَ ٱللَّهُ ٱلْمُؤْمِنِينَ وَ ٱلْمُؤْمِنَـٰتِ جَنَّـٰتٍۢ تَجْرِى مِن تَحْتِهَا ٱلْأَنْهَـٰرُ خَـٰلِدِينَ فِيهَا","noteFa":"خداوند به مردان و زنان با ايمان باغهايى وعده داده است كه از زير [درختان] آن نهرها جارى است در آن جاودانه خواهند بود.","noteEn":"God has promised the believers, both men and women, Gardens under which rivers flow, to stay there forever, "}],"reflections":[{"fa":"آیا در اعمال هر روزِ خود، رد‌پایی از همان نامِ ازلی خود می‌بینی که تو را به‌سوی مقامِ خاصِ خودت می‌راند؟ انجام کدامیک برایت راحت تر است؟ اعمال پسندیده یا ناپسند؟","en":"In your daily deeds, do you see traces of that primordial name of yours that drives you toward your own unique destiny? Which ones are easier for you to do: righteous deeds or unrighteous ones?","refs":[{"type":"hadith","surah":"","ayah":"","book":"bukhari","num":"4949","textAr":"مَا مِنْكُمْ مِنْ أَحَدٍ إِلاَّ وَ قَدْ كُتِبَ مَقْعَدُهُ مِنَ النَّارِ وَ مَقْعَدُهُ مِنَ الْجَنَّةِ ‏\"‏‏.‏ قَالُوا يَا رَسُولَ اللَّهِ أَفَلاَ نَتَّكِلُ عَلَى كِتَابِنَا وَ نَدَعُ الْعَمَلَ قَالَ ‏\"‏ اعْمَلُوا فَكُلٌّ مُيَسَّرٌ لِمَا خُلِقَ لَهُ، أَمَّا مَنْ كَانَ مِنْ أَهْلِ السَّعَادَةِ فَيُيَسَّرُ لِعَمَلِ أَهْلِ السَّعَادَةِ، وَ أَمَّا مَنْ كَانَ مِنْ أَهْلِ الشَّقَاءِ فَيُيَسَّرُ لِعَمَلِ أَهْلِ الشَّقَاوَةِ ‏\"‏‏.‏","noteFa":"پیامبر خدا فرمود: هیچ‌کس از شما نیست مگر آنکه جایگاهش در آتش دوزخ یا باغ بهشت [از پیش] نوشته شده است.» گفتند: «ای رسول خدا! پس آیا نباید بر آنچه برایمان نوشته شده تکیه کنیم و عمل را رها سازیم؟» فرمود: «به اعمال [نیک] خود ادامه دهید؛ زیرا برای هر کس، انجام کارهایی که او را به جایگاه مقدرش (همان هدفی که برایش آفریده شده) می‌رساند، آسان خواهد شد. پس آن کس که اهل سعادت [در آخرت] باشد، انجام اعمالِ سعادتمندان برایش آسان می‌شود، و آن کس که اهل شقاوت باشد، انجام اعمالِ شقاوتمندان برایش آسان خواهد شد.","noteEn":"The messenger of God said: 'There is none among you but has his place written for him either in the Hellfire or in Paradise.\" They said, \"O God's Messenger! Shall we not depend upon what has been written for us and give up deeds? He said, \"Carry on doing (good) deeds, for everybody will find easy to do such deeds as will lead him to his destined place for which he has been created. So he who is destined to be among the happy (in the Hereafter), will find it easy to do the deeds characteristic of such people, while he who is destined to be among the miserable ones, will find it easy to do the deeds characteristic of such people.'"}]}],"isShahBeyt":false,"shahBeytEn":"Don’t you compare yourself with God’s élite,\nRemember ‘souls’ just sounds like ‘soles’ of feet!","audioUrl":"https://pub-8a4a1795c6f64e5aa6236395759ee4db.r2.dev/%D8%B7%D9%88%D8%B7%DB%8C%20%D9%88%20%D8%A8%D9%82%D8%A7%D9%84%20%20%D8%A2%D8%AF%DB%8C%D9%88/1-289.mp3"},{"num":"290","text":"مومنش خوانند جانش خوش شود\nور منافق تیز و پر آتش شود\n","textErab":"مومِنَش خوانَند جانَش خوش شَوَد\nوَر مُنافِق تیز و پُر آتَش شَوَد","themes":["نفاق","اخلاص"],"sources":[],"maana":"اگر او را مؤمن بخوانند، جانش شاد و خوشحال  می‌شود و اگر منافق بخوانندش، عصبانی و تندخو می‌گردد.","maanaEn":"If he be called a believer, his soul rejoices, but if he is called a hypocrite, he becomes fierce and filled with fire (rage).","tafsir":"","tafsirEn":"","tafsirRefs":[],"reflections":[],"isShahBeyt":false,"shahBeytEn":"Although the hypocrites attend the prayer,\nIt’s just so they can start a quarrel there.","audioUrl":"https://pub-8a4a1795c6f64e5aa6236395759ee4db.r2.dev/%D8%B7%D9%88%D8%B7%DB%8C%20%D9%88%20%D8%A8%D9%82%D8%A7%D9%84%20%20%D8%A2%D8%AF%DB%8C%D9%88/1-290.mp3"},{"num":"291","text":"نام او محبوب از ذات وی است\nنام این مبغوض از آفات وی است‌‌","textErab":"نامِ او مَحبوب از ذاتِ وِی است\nنامِ این مَبغوض از آفاتِ وِی است","themes":["نفاق","اخلاص"],"sources":[],"maana":"نام «مؤمن» چون از ذات و سرشت پاکش بر می‌خیزد محبوب است و نام «منافق» چون از آفات و بیماری‌های درونی‌اش نشأت می‌گیرد منفور است.","maanaEn":"The believer's name is beloved because of his (pure) essence, while the hypocrite's name is loathed because of his (inner) flaws and corruptions.","tafsir":"نام مؤمن به خاطر پاکیِ ذات و ایمانِ درونی‌اش محبوب است؛ چرا که خودِ ایمان ارزشمند است و این ارزش به نامش هم سرایت می‌کند. در مقابل، نام منافق به خاطر صفت ناپسندِ دورویی و آفت‌های باطنی‌اش منفور است؛ زیرا زشتیِ نفاق، نام صاحبش را هم زشت و ناپسند می‌کند.","tafsirEn":"The name of the believer is beloved due to the purity of their essence and inner faith; since faith itself is inherently valuable, this worth extends to their very name. Conversely, the name of the hypocrite is detested due to the distasteful trait of duplicity and their inner afflictions; for the ugliness of hypocrisy renders the bearer's name ugly as well.","tafsirRefs":[],"reflections":[],"isShahBeyt":false,"shahBeytEn":"Although the hypocrites attend the prayer,\nIt’s just so they can start a quarrel there.","audioUrl":"https://pub-8a4a1795c6f64e5aa6236395759ee4db.r2.dev/%D8%B7%D9%88%D8%B7%DB%8C%20%D9%88%20%D8%A8%D9%82%D8%A7%D9%84%20%20%D8%A2%D8%AF%DB%8C%D9%88/1-291.mp3"},{"num":"292","text":"میم و واو و میم و نون تشریف نیست\nلفظ مومن جز پی تعریف نیست‌‌\n","textErab":"میم و واو و میم و نون تَشریف نیست\nلَفظِ مومِن جُز پِیِ تَعریف نیست","themes":["نفاق","اخلاص"],"sources":[{"type":"quran","surah":"49","ayah":"14","book":"","num":"","textAr":" قَالَتِ ٱلْأَعْرَابُ ءَامَنَّا ۖ قُل لَّمْ تُؤْمِنُوا۟ وَ لَـٰكِن قُولُوٓا۟ أَسْلَمْنَا وَ لَمَّا يَدْخُلِ ٱلْإِيمَـٰنُ فِى قُلُوبِكُمْ","note":"[برخى از] باديه‏ نشينان گفتند ايمان آورديم بگو ايمان نياورده‏ ايد ليكن بگوييد اسلام آورديم و هنوز در دلهاى شما ايمان داخل نشده است.","noteEn":"Some of˺ the nomadic Arabs say, “We believe.” Say, ˹O Prophet,˺ “You have not believed. But say, ‘We have submitted,’ for faith has not yet entered your hearts."},{"type":"quran","surah":"2","ayah":"8","book":"","num":"","textAr":"وَ مِنَ ٱلنَّاسِ مَن يَقُولُ ءَامَنَّا بِٱللَّهِ وَ بِٱلْيَوْمِ ٱلْـَٔاخِرِ و َمَا هُم بِمُؤْمِنِينَ","note":"و بعضى از مردم هستند كه ميگويند به خدا و روز جزا ايمان آورده ايم ولی (دروغ ميگويند و) هرگز ايمان نياورده اند.","noteEn":"And there are some who say, “We believe in God and the Last Day,” yet they are not ˹true˺ believers."}],"maana":"حروف م، و، م، ن (که کلمه «مومن» را می‌سازند) به خودی خود مایهٔ شرافت و بزرگی کسی نیستند بلکه لفظ «مومن» چیزی جز وسیله‌ای برای توصیف و تعریف (آن حقیقت درونی) نیست.","maanaEn":"(The letters) mím and wáw and mím and nún (that make up the word \"believer\") carry no honour (in themselves), and the word \"believer\" is nothing but a means of describing (and pointing to that inner reality).","tafsir":"این بیت توضیح می‌دهد کلمهٔ «مؤمن»، چه به صورت نوشته‌شده (مکتوب) و چه به صورت زبان‌آورده‌شده (ملفوظ)، مانند یک لباسِ تشریفاتی نیست که هر کس آن را بپوشد یا به زبان بیاورد، فوراً به مقام مؤمنِ واقعی برسد. ظاهر کلمات به خودی خود شرافتی برای کسی ایجاد نمی‌کنند. لفظ مؤمن فقط یک ابزار قراردادی است برای «تعریف کردن» و نشانی دادن از کسی که حقیقتِ ایمان در دل او وجود دارد.","tafsirEn":"This verse explains that the word 'believer', whether written or spoken, is not like a ceremonial robe that grants true spiritual status to anyone who wears it or utters it. The outward appearance of words does not, in and of itself, bestow honor upon anyone. The term 'believer' is merely a conventional tool used to define and point toward someone who truly possesses faith within their heart.","tafsirRefs":[],"reflections":[{"fa":"آیا تو هم گاه، مانندِ کسانی که گفتند «ایمان آوردیم» و پاسخ شنیدند که هنوز ایمان به دل‌هایشان راه نیافته، صرفاً با گفتنِ کلمه‌ای خود را «مؤمن» پنداشته‌ای بی‌آنکه حقیقتِ ایمان در دلت جای گرفته باشد؟","en":"Have you too, like those who said \"We believe\" and were told that faith had not yet entered their hearts, sometimes assumed yourself to be a believer merely by uttering the word, without that reality having truly settled in your heart?","refs":[{"type":"quran","surah":"49","ayah":"14","book":"","num":"","textAr":" قَالَتِ ٱلْأَعْرَابُ ءَامَنَّا ۖ قُل لَّمْ تُؤْمِنُوا۟ وَ لَـٰكِن قُولُوٓا۟ أَسْلَمْنَا وَ لَمَّا يَدْخُلِ ٱلْإِيمَـٰنُ فِى قُلُوبِكُمْ","noteFa":"[برخى از] باديه‏ نشينان گفتند ايمان آورديم بگو ايمان نياورده‏ ايد ليكن بگوييد اسلام آورديم و هنوز در دلهاى شما ايمان داخل نشده است.","noteEn":"Some of˺ the nomadic Arabs say, “We believe.” Say, ˹O Prophet,˺ “You have not believed. But say, ‘We have submitted,’ for faith has not yet entered your hearts."}]}],"isShahBeyt":false,"shahBeytEn":"Although the hypocrites attend the prayer,\nIt’s just so they can start a quarrel there.","audioUrl":"https://pub-8a4a1795c6f64e5aa6236395759ee4db.r2.dev/%D8%B7%D9%88%D8%B7%DB%8C%20%D9%88%20%D8%A8%D9%82%D8%A7%D9%84%20%20%D8%A2%D8%AF%DB%8C%D9%88/1-292.mp3"},{"num":"293","text":"گر منافق خوانی‌‌اش این نام دون\nهمچو کژدم می‌‌خلد در اندرون‌‌\n","textErab":"گَر مُنافِق خوانی‌اَش این نامِ دون\nهَمچو کَژدُم می‌خَلَد دَر اَندَرون","themes":["نفاق","اخلاص"],"sources":[],"maana":"وقتی (فرد دورو را) با نام واقعی‌اش یعنی «منافق» صدا می‌زنی، این اسمِ پست و بی‌ارزش، مانند عقرب عمق جانِ او را می‌گَزَد و می‌سوزاند.","maanaEn":"If you call the hypocrite a hypocrite, this vile name stings him inwardly like a scorpion.","tafsir":"این بیت دقیقاً به همان مفهومِ ابیاتِ قبل اشاره دارد: از آنجا که نفس منافق بیمار و خبیث است، کلمهٔ «منافق» مثل یک آیینه عمل می‌کند که زشتیِ درونش را به او نشان می‌دهد. به همین دلیل، این نام برای او یک لفظِ ساده نیست، بلکه مانند زهرِ عقرب، درونش را آشفته و مضطرب می‌کند؛ برعکسِ مؤمن که چون ذاتش پاک است، از هیچ لقب و سخن زشتی آسیب نمی‌بیند و متأثر نمی‌شود.","tafsirEn":"This verse points directly to the very same concept as the preceding lines: since the hypocrite's soul is diseased and malicious, the word 'hypocrite' acts as a mirror, reflecting his inner ugliness back at him. For this reason, the name is not just a simple word to him; rather, it agitates and distresses him like a scorpion’s venom. This stands in sharp contrast to the believer, whose pure essence shields them from being harmed or moved by any vile epithet or hurtful words.","tafsirRefs":[],"reflections":[{"fa":"آیا تونیز مانند منافقان، در اعماق جانت، از اینکه با نامِ راستینت خوانده شوی هراس داری؟","en":"Do you, like hypocrites, deep down in your heart, fear to be called by your true name?","refs":[{"type":"quran","surah":"9","ayah":"64","book":"","num":"","textAr":"يَحْذَرُ ٱلْمُنَـٰفِقُونَ أَن تُنَزَّلَ عَلَيْهِمْ سُورَةٌۭ تُنَبِّئُهُم بِمَا فِى قُلُوبِهِمْ ۚ قُلِ ٱسْتَهْزِءُوٓا۟ إِنَّ ٱللَّهَ مُخْرِجٌۭ مَّا تَحْذَرُونَ","noteFa":"منافقان بيم دارند از اينكه [مبادا] سوره‏اى درباره آنان نازل شود كه ايشان را از آنچه در دل‌هايشان هست‏ خبر دهد بگو ريشخند كنيد بى‏‌ترديد خدا آنچه را كه [از آن] مى‏‌ترسيد برملا خواهد كرد.","noteEn":"The hypocrites fear that a sûrah should be revealed about them, exposing what is in their hearts. Say, ˹O Prophet,˺ “Keep mocking! God will definitely bring to light what you fear.”"}]}],"isShahBeyt":false,"shahBeytEn":"Although the hypocrites attend the prayer,\nIt’s just so they can start a quarrel there.","audioUrl":"https://pub-8a4a1795c6f64e5aa6236395759ee4db.r2.dev/%D8%B7%D9%88%D8%B7%DB%8C%20%D9%88%20%D8%A8%D9%82%D8%A7%D9%84%20%20%D8%A2%D8%AF%DB%8C%D9%88/1-293.mp3"},{"num":"294","text":"گرنه این نام اشتقاق دوزخ است\nپس چرا در وی مذاق دوزخ است‌‌\n","textErab":"گَرنِه این نام اِشتِقاقِ دوزَخ است\nپَس چِرا دَر وِی مَذاقِ دوزَخ است","themes":["نفاق","اخلاص"],"sources":[{"type":"quran","surah":"9","ayah":"49","book":"","num":"","textAr":"وَ إِنَّ جَهَنَّمَ لَمُحِيطَةٌۢ بِٱلْكَـٰفِرِينَ","note":"و بى‏ ترديد جهنم بر كافران احاطه دارد.","noteEn":"and most surely hell encompasses the unbelievers."}],"maana":"اگر این نام (منافق) از جهنم ریشه نگرفته است، پپس چرا (چشیدن آن) طعم و مذاق جهنم را دارد؟","maanaEn":"If this name is not derived from Hell, then why does it carry the very taste (and burning sense) of Hell?","tafsir":"این بیت اشاره دارد که جهنمِ واقعی همان اخلاقِ زشت و ملکاتِ بد نفسانی است. نفاق و دورویی از این دوزخِ صفاتِ باطنی سرچشمه می‌گیرد. بنابراین، همان‌طور که در قواعد زبان بین کلمهٔ مشتق و ریشهٔ آن رابطه برقرار است، بین عملِ نفاق و ریشهٔ دوزخیِ آن نیز پیوندی حقیقی وجود دارد که باعث می‌شود آن منافق مذاق دوزخ
