<script>
/* Measure the real visible viewport height in pixels (more reliable across
   devices/browsers than vh/dvh units) and expose it as --app-height so the
   app exactly fills the screen with no leftover gap. */
(function(){
  function setAppHeight(){
    var h = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
    document.documentElement.style.setProperty('--app-height', h + 'px');
  }
  setAppHeight();
  window.addEventListener('resize', setAppHeight);
  window.addEventListener('orientationchange', function(){ setTimeout(setAppHeight, 100); });
  if(window.visualViewport) window.visualViewport.addEventListener('resize', setAppHeight);
})();
</script>
<script>
/* localStorage-backed shim for window.storage, so the panel's existing
   sv()/ld()/rm() calls work unmodified as a standalone web app. */
(function(){
  function k(key,shared){ return (shared?'shared:':'priv:')+key; }
  window.storage = {
    get: function(key,shared){
      return new Promise(function(resolve){
        try{
          var v = localStorage.getItem(k(key,shared));
          resolve(v==null?null:{key:key,value:v,shared:!!shared});
        }catch(e){ resolve(null); }
      });
    },
    set: function(key,value,shared){
      return new Promise(function(resolve){
        try{
          localStorage.setItem(k(key,shared), value);
          resolve({key:key,value:value,shared:!!shared});
        }catch(e){ resolve(null); }
      });
    },
    delete: function(key,shared){
      return new Promise(function(resolve){
        try{
          var existed = localStorage.getItem(k(key,shared))!=null;
          localStorage.removeItem(k(key,shared));
          resolve({key:key,deleted:existed,shared:!!shared});
        }catch(e){ resolve(null); }
      });
    },
    list: function(prefix,shared){
      return new Promise(function(resolve){
        try{
          var pre=(shared?'shared:':'priv:')+(prefix||'');
          var keys=[];
          for(var i=0;i<localStorage.length;i++){
            var lk=localStorage.key(i);
            if(lk.indexOf(pre)===0) keys.push(lk.slice(shared?7:5));
          }
          resolve({keys:keys,prefix:prefix,shared:!!shared});
        }catch(e){ resolve(null); }
      });
    }
  };
})();
</script>

function E(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function A(s){return E(s).replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function hl(s,q){var esc=E(s);if(!q)return esc;var qq=String(q).trim();if(!qq)return esc;try{var re=buildHlRegex(qq);if(!re)return esc;return esc.replace(re,'<mark style="background:#FFE066;color:#1a1a1a;border-radius:3px;padding:0 1px">$1</mark>');}catch(e){return esc;}}
function buildHlRegex(qq){
  if(!qq)return null;
  var HAR='[\\u064B-\\u065F\\u0670\\u06D6-\\u06ED\\u200c\\u200f\\u200e]*';
  var LETTER_CLASS={'ا':'[اأإآٱ]','أ':'[اأإآٱ]','إ':'[اأإآٱ]','آ':'[اأإآٱ]','ٱ':'[اأإآٱ]','ی':'[یي]','ي':'[یي]','ک':'[کك]','ك':'[کك]','ة':'[ةه]','ه':'[ةه]'};
  var chars=qq.split('');
  var parts=[];
  chars.forEach(function(ch){
    var piece;
    if(/\s/.test(ch)){piece='[\\s\\u200c]+';}
    else if(LETTER_CLASS[ch]){piece=LETTER_CLASS[ch];}
    else{piece=ch.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}
    parts.push(piece);
  });
  if(!parts.length)return null;
  return new RegExp('('+parts.join(HAR)+')','gi');
}

function div_(a,b){return Math.floor(a/b);}
function gregorianToJalali(gy,gm,gd){var g_d_m=[0,31,59,90,120,151,181,212,243,273,304,334];var gy2=(gm>2)?(gy+1):gy;var days=355666+(365*gy)+div_(gy2+3,4)-div_(gy2+99,100)+div_(gy2+399,400)+gd+g_d_m[gm-1];var jy=-1595+(33*div_(days,12053));days%=12053;jy+=4*div_(days,1461);days%=1461;if(days>365){jy+=div_(days-1,365);days=(days-1)%365;}var jm,jd;if(days<186){jm=1+div_(days,31);jd=1+(days%31);}else{jm=7+div_(days-186,30);jd=1+((days-186)%30);}return[jy,jm,jd];}
function isJalaliLeap(jy){var r=((jy+38)*682)%2816;return r<682;}
function jalaliMonthLength(jy,jm){if(jm<=6)return 31;if(jm<=11)return 30;return isJalaliLeap(jy)?30:29;}
function jalaliToGregorian(jy,jm,jd){jy+=1595;var days=-355668+(365*jy)+(div_(jy,33)*8)+div_(((jy%33)+3),4)+jd+((jm<7)?(jm-1)*31:((jm-7)*30)+186);var gy=400*div_(days,146097);days%=146097;if(days>36524){gy+=100*div_(--days,36524);days%=36524;if(days>=365)days++;}gy+=4*div_(days,1461);days%=1461;if(days>365){gy+=div_(days-1,365);days=(days-1)%365;}var gd=days+1;var isLeapG=(gy%4===0&&gy%100!==0)||(gy%400===0);var sal_a=[0,31,isLeapG?29:28,31,30,31,30,31,31,30,31,30,31];var gm;for(gm=1;gm<=12;gm++){if(gd<=sal_a[gm])break;gd-=sal_a[gm];}return[gy,gm,gd];}

function addPts(n,src){userData.points=(userData.points||0)+n;if(src==='purchase')userData.totalPurchased=(userData.totalPurchased||0)+n;else userData.totalEarned=(userData.totalEarned||0)+n;sv(UK,userData);setText('pts-num',getPts());if(src!=='purchase'){if(!streakData.dailyPts)streakData.dailyPts={};var today=todayStr();streakData.dailyPts[today]=(streakData.dailyPts[today]||0)+n;sv(SK,streakData);checkStreakProgress();}}

function updateStreak(){var today=todayStr();if(streakData.last===today)return;var yest=new Date(Date.now()-86400000).toISOString().slice(0,10);var isFrzDay=(streakData.frozenDays||[]).indexOf(yest)>=0;if(streakData.last===yest||isFrzDay){streakData.streak++;}else if(streakData.last&&streakData.last!==today){if((streakData.freezes||0)>0){streakData.freezes--;if(!streakData.frozenDays)streakData.frozenDays=[];streakData.frozenDays.push(yest);streakData.streak++;var F=prefs.lang=='fa';setTimeout(function(){toast(F?'🧊 فریز استریک به‌صورت خودکار استفاده شد! ('+streakData.freezes+' فریز مانده)':'🧊 Streak freeze used automatically! ('+streakData.freezes+' remaining)',2800);},400);if(streakData.freezes===0){setTimeout(function(){var F2=prefs.lang=='fa';toast(F2?'⚠️ تمام فریزهای شما تمام شد!':'⚠️ All freezes used!',3200);},3600);}}else{streakData.streak=1;}}else if(!streakData.last){streakData.streak=1;}streakData.last=today;if(streakData.history.indexOf(today)<0)streakData.history.push(today);sv(SK,streakData);setText('streak-num',streakData.streak);checkStreakMilestone();}

async function initLoad(){
  var p=await ld(PK);if(p)prefs=Object.assign(prefs,p);
  var u=await ld(UK);var isFirstVisit=!u;if(u)userData=u;
  var s=await ld(SK);if(s)streakData=Object.assign({streak:0,last:'',history:[],done:[],freezes:0,frozenDays:[],milestonesAwarded:[],dailyPts:{}},s);
  var rd=await ld(RK);if(rd)refData=Object.assign({studied:{},pointed:{},log:[],pageAwarded:{},popupAwarded:{},quranLog:[],hadithLog:[],sbrLog:[],purchasedContent:{}},rd);
  var dn=await ld(DK);if(dn)dailyNotes=dn;
  var fb=await ld(FK);if(fb)feedbackLog=fb;
  await loadManifest();
  if(manifest&&manifest.books&&prefs.lastBookId!=null&&prefs.lastStoryId!=null){
    var rBook=manifest.books.find(function(b){return b.id===prefs.lastBookId;});
    var rStory=rBook&&rBook.stories?rBook.stories.find(function(s){return s.id===prefs.lastStoryId;}):null;
    if(rStory){
      try{
        var res=await fetch(CONTENT_BASE+rStory.file,{cache:'no-store'});
        if(res.ok){
          var data=await res.json();
          if(data.verses&&data.verses.length>1){
            verses=data.verses;lessons=data.lessons||[];hasContent=true;
            currentBookId=prefs.lastBookId;currentStoryId=prefs.lastStoryId;
          }
        }
      }catch(e){}
    }
  }
  buildNumIndex();applyPrefs();updateStatusBox();
  setText('pts-num',getPts());setText('streak-num',streakData.streak);
  markAct();render();
  if(isFirstVisit){
    addPts(PT_WELCOME);
    var F=prefs.lang=='fa';
    setTimeout(function(){toast(F?'🎉 خوش آمدی! جایزهٔ ورود: +'+PT_WELCOME+' 💎':'🎉 Welcome! Sign-up bonus: +'+PT_WELCOME+' 💎',3200);},700);
  }
}
function checkReminder(){
  if(!prefs.reminderTime)return;
  if(!('Notification' in window))return;
  if(Notification.permission!=='granted')return;
  var now=new Date();
  var hh=String(now.getHours()).padStart(2,'0');
  var mm=String(now.getMinutes()).padStart(2,'0');
  var cur=hh+':'+mm;
  var today=todayStr();
  if(cur===prefs.reminderTime&&prefs.lastNotifiedDate!==today){
    prefs.lastNotifiedDate=today;sv(PK,prefs);
    var F=prefs.lang=='fa';
    var title=F?'یادآوری مطالعهٔ مثنوی':'Masnavi Study Reminder';
    var body=F?'وقتشه چند بیت امروز رو مطالعه کنی 📖':"Time for today's couplets 📖";
    if(navigator.serviceWorker&&navigator.serviceWorker.ready){
      navigator.serviceWorker.ready.then(function(reg){reg.showNotification(title,{body:body,icon:'icons/icon-192.png',badge:'icons/icon-192.png'});}).catch(function(){try{new Notification(title,{body:body,icon:'icons/icon-192.png'});}catch(e){}});
    }else{try{new Notification(title,{body:body,icon:'icons/icon-192.png'});}catch(e){}}
  }
}
initLoad();
setInterval(checkReminder,20000);
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')checkReminder();});
